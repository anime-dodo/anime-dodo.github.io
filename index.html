<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="ryuk">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>ryuk</title>
  <link rel="manifest" href="manifest.json">
  <style>
    /* Évite un flash blanc (fond par défaut de la page) pendant les
       changements de mise en page comme le passage en plein écran, le
       temps que Flutter redessine son propre fond noir. */
    html, body {
      background-color: #000000;
    }
  </style>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>

  <!--
    Rendu ASS fidèle pour les sous-titres (police/couleurs/position d'origine
    préservées) via JASSUB, accroché directement à l'élément <video> créé par
    le lecteur (voir video_player_screen.dart, _attachAssSubtitlesIfNeeded).
    Chargé depuis jsDelivr (CDN), version figée pour éviter qu'une mise à
    jour de la librairie casse silencieusement le site plus tard.
    Si ce script ne charge pas (pas de réseau, bloqueur...), l'app retombe
    automatiquement sur son ancien overlay texte — rien ne casse.
  -->
  <script type="module">
    import JASSUB from 'https://cdn.jsdelivr.net/npm/jassub@2.5.14/+esm';

    const JASSUB_BASE = 'https://cdn.jsdelivr.net/npm/jassub@2.5.14/dist/';

    // Un Worker ne peut pas être créé directement depuis une URL d'un autre
    // domaine (restriction navigateur), même si le fichier existe bien sur
    // le CDN. On contourne ça avec un petit script "relais" en mémoire
    // (blob, donc considéré comme venant de notre propre origine) qui se
    // contente d'importer le vrai script distant. Le worker de JASSUB est
    // un module ES ("type: module"), donc on utilise "import" et non
    // "importScripts" (réservé aux workers classiques, refusé ici par le
    // navigateur).
    function localWorkerUrl(remoteUrl) {
      const blob = new Blob(
        [`import ${JSON.stringify(remoteUrl)};`],
        { type: 'application/javascript' }
      );
      return URL.createObjectURL(blob);
    }

    window.attachJassub = function (videoEl, assContent) {
      try {
        return new JASSUB({
          video: videoEl,
          subContent: assContent,
          workerUrl: localWorkerUrl(JASSUB_BASE + 'worker/worker.js'),
          wasmUrl: JASSUB_BASE + 'wasm/jassub-worker.wasm',
          modernWasmUrl: JASSUB_BASE + 'wasm/jassub-worker-modern.wasm',
        });
      } catch (e) {
        console.error('JASSUB : accroche échouée, repli sur l\'overlay texte.', e);
        return null;
      }
    };

    window.detachJassub = function (instance) {
      if (instance && typeof instance.destroy === 'function') {
        instance.destroy().catch(() => {});
      }
    };
  </script>
</body>
</html>
