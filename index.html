<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="ryuk">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>ryuk</title>
  <link rel="manifest" href="manifest.json">
  <style>
    /* Évite un flash blanc (fond par défaut de la page) pendant les
       changements de mise en page comme le passage en plein écran, le
       temps que Flutter redessine son propre fond noir. */
    html, body {
      background-color: #000000;
    }
  </style>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>

  <!--
    Rendu ASS fidèle pour les sous-titres (police/couleurs/position d'origine
    préservées) via SubtitlesOctopus (le moteur original "libass-wasm"),
    accroché directement à l'élément <video> créé par le lecteur (voir
    video_player_screen.dart, _attachAssSubtitlesIfNeeded).

    On utilisait auparavant "JASSUB" (un fork de cette même librairie), mais
    JASSUB tente de lire les pixels de la vidéo via l'API VideoFrame pour
    détecter son espace colorimétrique — ce qui provoque une erreur de
    sécurité ("tainted sources") car nos vidéos (hébergées sur StreamTape,
    un autre domaine) n'ont pas les en-têtes CORS nécessaires. Ça cassait le
    rendu des sous-titres de façon quasi systématique (écran noir). La
    librairie originale SubtitlesOctopus n'a PAS cette fonctionnalité : elle
    ne lit jamais les pixels de la vidéo, seulement sa position de lecture
    (currentTime), donc aucun souci de CORS possible.

    Les fichiers (voir web/octopus/) sont téléchargés depuis le paquet npm
    "libass-wasm" et hébergés directement avec le site (pas de CDN à
    l'exécution, pour les mêmes raisons qu'avant : un Worker doit être
    chargé depuis la même origine que la page).
    Si ce script ne charge pas, l'app retombe automatiquement sur son ancien
    overlay texte — rien ne casse.
  -->
  <script src="/octopus/subtitles-octopus.js"></script>
  <script>
    // onError (optionnel, fourni par Dart) : SubtitlesOctopus l'appelle si
    // le rendu échoue APRÈS l'accroche (ex : fichier .ass corrompu pour cet
    // épisode précis, plantage du Worker) — un cas que notre try/catch côté
    // Dart ne peut pas voir puisqu'il est asynchrone. Ça permet à l'app de
    // basculer sur son overlay texte de secours même dans ce cas-là, au
    // lieu de rester sans aucun sous-titre.
    window.attachJassub = function (videoEl, assContent, onError) {
      try {
        return new SubtitlesOctopus({
          video: videoEl,
          subContent: assContent,
          workerUrl: '/octopus/subtitles-octopus-worker.js',
          // Le fichier .wasm (subtitles-octopus-worker.wasm) est chargé
          // automatiquement par le worker depuis son propre dossier — pas
          // besoin de l'indiquer séparément.
          onError: function (err) {
            console.error('SubtitlesOctopus : erreur de rendu, repli sur l\'overlay texte.', err);
            if (onError) onError(String((err && err.message) || err || 'erreur inconnue'));
          },
        });
      } catch (e) {
        console.error('SubtitlesOctopus : accroche échouée, repli sur l\'overlay texte.', e);
        if (onError) onError(String((e && e.message) || e || 'erreur inconnue'));
        return null;
      }
    };

    window.detachJassub = function (instance) {
      if (instance && typeof instance.dispose === 'function') {
        instance.dispose();
      }
    };
  </script>
</body>
</html>
