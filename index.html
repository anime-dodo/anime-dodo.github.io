<script>
const API_BASE = 'https://animedodo.duckdns.org';

// Colle ici ta clé admin (celle du panel, voir .env du serveur) — sert
// UNIQUEMENT à lire la sélection "à la une" (GET /api/admin/featured), qui
// est volontairement privée (même la simple lecture demande la clé, pas
// seulement l'écriture). Ce fichier reste sur ton PC tant que tu ne
// publies pas, donc coller la clé ici est sans risque pour l'instant —
// à RETIRER avant toute publication publique du site (une clé posée en
// clair dans du JS livré au navigateur serait alors visible de tous).
// Laisse vide pour ignorer la sélection manuelle (bandeau 100% automatique).
const ADMIN_KEY_FOR_FEATURED = 'hzYxbpo47#0';

// Animés du bandeau "à la une" (hero), DANS L'ORDRE — choisis depuis le
// panel admin (section "⭐ Bandeau à la une", public/index.html côté
// serveur), pas ici : rempli au chargement via GET /api/admin/featured (voir
// init()). Si vide (rien choisi dans le panel, ou pas de clé ci-dessus), le
// reste est complété automatiquement avec les animés les plus récents ayant
// une bannière — comme le fait le vrai site par défaut (8 premiers avec
// bannerImage, voir "featured" dans main.dart).
let HERO_ANIME_IDS = [];

// ---------- Persistance de l'écran via l'URL (reload = on reste là) ----------
//
// Ce site n'a AUCUN moteur de routing interne qui dispute le hash de l'URL
// (contrairement à l'ancienne version Flutter, où Flutter web réécrivait le
// hash tout seul) : on peut donc gérer l'historique nous-mêmes avec
// history.pushState/popstate sans conflit — un F5 recharge index.html (page
// statique, le hash n'est jamais envoyé au serveur, donc pas de 404 sur
// GitHub Pages même sur un lien profond), et le JS relit ensuite
// location.hash pour rouvrir la bonne vue.
//
// Formats de hash utilisés :
//   #/anime/<id>                      -> fiche détail
//   #/anime/<id>/ep/<n>               -> lecteur, langue par défaut
//   #/anime/<id>/ep/<n>/vostfr|vf     -> lecteur, langue précisée
//   #/ (ou vide)                      -> accueil
//
// `suppressHistoryPush` évite qu'une navigation déclenchée EN LISANT
// l'historique (restauration au chargement, bouton précédent/suivant du
// navigateur) ne re-pousse une nouvelle entrée par-dessus.
let suppressHistoryPush = false;

function pushHistoryState(hash, state) {
  if (suppressHistoryPush) return;
  const target = hash || '#/';
  if (location.hash === target) return;
  history.pushState(state || null, '', target);
}

// Relit un hash (au chargement, ou suite à un popstate) et rouvre la vue
// correspondante. `anime` est retrouvé via fetchAnimeMeta, qui sert
// d'abord le cache déjà rempli par init() — donc quasi instantané une fois
// le catalogue chargé, et fonctionne même avant si l'animé n'y est pas
// encore (nouvelle requête réseau).
async function restoreFromHash(hash) {
  const epMatch = /^#\/anime\/(\d+)\/ep\/(\d+)(?:\/(vostfr|vf))?$/.exec(hash || '');
  const detailMatch = /^#\/anime\/(\d+)$/.exec(hash || '');

  try {
    if (epMatch) {
      const animeId = Number(epMatch[1]);
      const epNumber = Number(epMatch[2]);
      const lang = epMatch[3];
      const anime = await fetchAnimeMeta(animeId);
      if (!anime) return;
      const wasSuppressed = suppressHistoryPush;
      suppressHistoryPush = true;
      try {
        await openDetail(anime);
        if (lang) detailSelectedLanguage = lang;
        const videos = await fetchServerVideos(animeId);
        const entry = videos && videos[epNumber];
        if (entry) {
          // Reprend là où on en était avant le reload (ex: 18 min sur 24) —
          // la progression a été enregistrée en continu pendant la lecture
          // (registerWatchProgress) et relue depuis localStorage par
          // loadWatchProgressFromStorage() juste avant, dans init().
          const wp = watchProgress.get(animeId);
          const resumeFraction = (wp && wp.episode === epNumber) ? wp.fraction : null;
          openPlayer(anime, epNumber, entry, resumeFraction);
        }
      } finally {
        suppressHistoryPush = wasSuppressed;
      }
    } else if (detailMatch) {
      const animeId = Number(detailMatch[1]);
      const anime = await fetchAnimeMeta(animeId);
      if (!anime) return;
      const wasSuppressed = suppressHistoryPush;
      suppressHistoryPush = true;
      try {
        await openDetail(anime);
      } finally {
        suppressHistoryPush = wasSuppressed;
      }
    }
  } catch (e) {
    // Lien cassé (animé supprimé, id invalide...) : on reste simplement sur
    // l'accueil plutôt que de planter la page.
    console.error('[restoreFromHash]', e);
  } finally {
    // Que ça ait marché (openDetail/openPlayer ont déjà pris le relais via
    // leur propre style.display/view-visible) ou raté (lien cassé -> repli
    // sur l'accueil), on retire les masquages anti-flash posés tout en haut
    // du <body> : sinon la vue concernée resterait invisible pour de bon
    // après un closeDetail()/closePlayer() plus tard dans la session.
    document.documentElement.classList.remove('preload-hide-home', 'preload-hide-detail');
  }
}

// Bouton précédent/suivant du navigateur : on ferme la vue la plus "profonde"
// d'abord (lecteur avant fiche détail), pour matcher la pile logique
// accueil -> fiche -> lecteur, puis on retente une restauration complète
// pour le cas où l'utilisateur a sauté directement vers un autre hash
// (navigation clavier dans l'historique, etc.).
window.addEventListener('popstate', () => {
  const hash = location.hash;
  const playerOpen = document.getElementById('playerView').classList.contains('active');
  const detailOpen = document.getElementById('detailView').classList.contains('view-visible');

  suppressHistoryPush = true;
  try {
    if (!/^#\/anime\/\d+\/ep\/\d+/.test(hash) && playerOpen) closePlayer();
    if (!/^#\/anime\/\d+$/.test(hash) && !/^#\/anime\/\d+\/ep\/\d+/.test(hash) && detailOpen) closeDetail();
  } finally {
    suppressHistoryPush = false;
  }
  if (/^#\/anime\/\d+/.test(hash)) restoreFromHash(hash);
});

function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => el.classList.remove('show'), 2500);
}

const GENRE_FR = {
  Action: 'Action', Adventure: 'Aventure', Comedy: 'Comédie', Drama: 'Drame',
  Fantasy: 'Fantaisie', Horror: 'Horreur', Mystery: 'Mystère', Romance: 'Romance',
  'Sci-Fi': 'Science-fiction', 'Slice of Life': 'Tranche de vie', Sports: 'Sport',
  Supernatural: 'Surnaturel', Thriller: 'Thriller', Psychological: 'Psychologique',
  Mecha: 'Mecha', Music: 'Musique', Ecchi: 'Ecchi',
};
function translateGenre(g) { return GENRE_FR[g] || g; }

// ---------- Récupération des données (mêmes endpoints que l'app Flutter) ----------

async function fetchPostedIds() {
  const res = await fetch(`${API_BASE}/api/animes`);
  if (!res.ok) throw new Error('HTTP ' + res.status);
  return res.json();
}

// Cache mémoire (durée de session) des métadonnées AniList par animé — copie
// de _animeMetaCache côté Flutter : évite de redemander un animé déjà vu
// pendant cette session (retour à l'accueil, etc.).
const animeMetaCache = new Map();

// En plus du cache mémoire (qui se vide à chaque F5), un petit cache
// localStorage : spécifique à ce prototype (n'existe pas côté Flutter), pour
// que les rechargements répétés pendant les tests ne retapent pas tout le
// catalogue à chaque fois. Les métadonnées AniList changent rarement, donc
// une validité de 6h est largement suffisante.
const ANIME_META_LS_TTL = 6 * 60 * 60 * 1000;
function readAnimeMetaFromStorage(id) {
  try {
    const raw = localStorage.getItem('adn_anime_meta_' + id);
    if (!raw) return null;
    const entry = JSON.parse(raw);
    if (!entry || Date.now() - entry.ts > ANIME_META_LS_TTL) return null;
    return entry.data;
  } catch {
    return null;
  }
}
function writeAnimeMetaToStorage(id, data) {
  try {
    localStorage.setItem('adn_anime_meta_' + id, JSON.stringify({ ts: Date.now(), data }));
  } catch {
    // Quota dépassé ou stockage désactivé : tant pis, on retapera le réseau.
  }
}

// IMPORTANT : le texte de cette requête doit être un copié-collé EXACT de
// `_fields` côté Flutter (main.dart), champ pour champ, même ordre. Le
// serveur (API_BASE/api/anilist) met en cache chaque requête 30 jours en se
// basant sur son texte exact : le vrai site l'a déjà "chauffé" pour tout le
// catalogue posté, donc une requête identique tombe sur ce cache déjà chaud
// (quasi instantané) au lieu de retaper AniList directement (lent, et
// limité en débit) à chaque animé. Une requête différente — même juste un
// champ en plus ou en moins — rate ce cache et retombe dans le cas lent.
async function fetchAnimeMeta(id) {
  const cached = animeMetaCache.get(id);
  if (cached) return cached;
  const fromStorage = readAnimeMetaFromStorage(id);
  if (fromStorage) {
    animeMetaCache.set(id, fromStorage);
    return fromStorage;
  }

  const query = `
    query {
      Media(id: ${id}, type: ANIME) {
        id
        title { romaji english }
        coverImage { extraLarge large }
        bannerImage
        genres
        averageScore
        description(asHtml: false)
        episodes
        format
        startDate { year month day }
        nextAiringEpisode { episode }
      }
    }
  `;

  // Retries avec backoff sur les codes temporaires, comme _query côté
  // Flutter (429/500/502/503/504, 4 tentatives, 800ms * tentative).
  const retryableCodes = new Set([429, 500, 502, 503, 504]);
  for (let attempt = 0; attempt < 4; attempt++) {
    try {
      const res = await fetch(`${API_BASE}/api/anilist`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ query }),
      });
      if (res.ok) {
        const data = await res.json();
        const media = data?.data?.Media || null;
        if (media) {
          animeMetaCache.set(id, media);
          writeAnimeMetaToStorage(id, media);
        }
        return media;
      }
      if (!retryableCodes.has(res.status)) return null;
    } catch {
      // on retente ci-dessous
    }
    if (attempt < 3) await new Promise((r) => setTimeout(r, 800 * (attempt + 1)));
  }
  return null;
}

async function fetchTitleLogo(anime) {
  try {
    const res = await fetch(`${API_BASE}/api/title-logo`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        animeId: anime.id,
        title: anime.title?.english || anime.title?.romaji,
        titleRomaji: anime.title?.romaji,
        format: anime.format,
      }),
    });
    if (!res.ok) return null;
    const data = await res.json();
    return data?.logoUrl || null;
  } catch {
    return null;
  }
}

// Précharge une image (démarre le téléchargement SANS la poser dans le
// DOM) et ne se résout qu'une fois COMPLÈTE : utilisé pour que l'image soit
// déjà dans le cache HTTP du navigateur avant qu'on construise le <img>
// final, qui s'affiche alors instantanément (comme une bannière normale),
// jamais par petits bouts au fur et à mesure du téléchargement.
function preloadImage(url) {
  return new Promise((resolve) => {
    const img = new Image();
    img.onload = () => resolve(true);
    img.onerror = () => resolve(false);
    img.src = url;
  });
}

// Même chose que fetchTitleLogo, mais bornée dans le temps ET en
// préchargeant aussi l'IMAGE elle-même (pas seulement son URL) avant de
// rendre la main — sans ça, le logo semblait "instantané" pour l'API mais
// mettait quand même du temps à s'afficher une fois le <img> construit
// ailleurs (retour utilisateur : "je veux qu'il soit instantané comme la
// bannière"), le temps que l'image se télécharge à SON tour. Le logo
// n'apparaît normalement PAS après coup sur une bannière déjà affichée
// (retour utilisateur : "les logos mettent plus de temps à apparaître que
// la page") : on attend donc le logo ET son image un court instant AVANT
// d'afficher la bannière, avec un délai maximum pour ne jamais bloquer la
// navigation si l'API ou l'image est lente.
async function fetchTitleLogoWithTimeout(anime, ms) {
  return Promise.race([
    (async () => {
      const logoUrl = await fetchTitleLogo(anime);
      if (!logoUrl) return null;
      const ok = await preloadImage(logoUrl);
      return ok ? logoUrl : null;
    })(),
    new Promise((resolve) => setTimeout(() => resolve(null), ms)),
  ]);
}

// Construit un <img> pour un logo de titre, mais ne le donne (callback)
// qu'UNE FOIS entièrement chargé — jamais inséré dans la page avec juste
// `src` posé. Sans ça, le navigateur affiche l'image AU FUR ET À MESURE
// qu'elle arrive du réseau (surtout un PNG progressif) : on voyait un petit
// bout du logo apparaître puis le reste "popper" d'un coup une fraction de
// seconde après (retour utilisateur). `new Image()` démarre le
// téléchargement sans toucher au DOM ; seul le 'load' (image COMPLÈTE)
// déclenche réellement l'affichage. Sert surtout de repli pour un logo
// arrivé APRÈS coup (pas via fetchTitleLogoWithTimeout, qui précharge déjà
// l'image elle-même) : si l'image a déjà été préchargée plus haut, ce
// 'load' arrive quasi instantanément (servi depuis le cache HTTP).
function loadLogoImg(src, className, alt, onReady) {
  const img = new Image();
  img.className = className;
  if (alt) img.alt = alt;
  img.onload = () => onReady(img);
  img.onerror = () => {}; // échec silencieux : le repli (titre texte) reste affiché
  img.src = src;
}

// ---- Synopsis en français (voir /api/synopsis-fr côté serveur, utilisé par
// AnimeService.fetchFrenchSynopsis dans l'app Flutter) : sans cet appel, le
// texte AniList brut (description) est en anglais pour la plupart des animés.
const _frenchSynopsisCache = {};
// ---------- Regroupement par franchise (saisons/parties/films) ----------
// But : dans les résultats de recherche, "Attack on Titan" et "Attack on
// Titan Season 2" ne doivent afficher qu'UNE seule fiche (la première
// sortie) — la fiche détail liste ensuite toutes les entrées de la franchise
// sous forme de badges (Saison 1 / Saison 2 / Film…), dans l'ordre de
// sortie. Pas d'appel réseau supplémentaire : uniquement basé sur le titre,
// donc forcément imparfait dans quelques cas limites, mais couvre les cas
// courants (suffixes "Season N"/"Nth Season"/"Part N"/"Movie", ET les
// franchises à parties différemment nommées type "JoJo's Bizarre Adventure:
// Stone Ocean" grâce au découpage sur ":").
function getFranchiseGroupKey(anime) {
  const raw = (anime?.title?.english || anime?.title?.romaji || '').trim();
  if (!raw) return `id:${anime?.id}`;
  // Partie avant ":" si présente — couvre les parties à noms différents
  // (JoJo's Bizarre Adventure: X, Y, Z partagent toutes "jojo's bizarre
  // adventure" avant les deux-points).
  const colonIdx = raw.indexOf(':');
  let base = colonIdx > 0 ? raw.slice(0, colonIdx) : raw;
  base = base
    .replace(/\bthe\s+final\s+season\b/gi, ' ')
    .replace(/\b\d+(st|nd|rd|th)\s+season\b/gi, ' ')
    .replace(/\bseason\s+\d+\b/gi, ' ')
    .replace(/\bpart\s+\d+\b/gi, ' ')
    .replace(/\bcour\s+\d+\b/gi, ' ')
    .replace(/\bmovie\s*\d*\b/gi, ' ')
    .replace(/\b(the\s+)?film\b/gi, ' ')
    .replace(/\bova\b/gi, ' ')
    // Sous-titre ajouté après le numéro de saison, du genre "Solo Leveling
    // Season 2 -Arise from the Shadow-" — une fois "Season 2" retiré
    // au-dessus, il reste " -Arise from the Shadow-" qui empêchait ce titre
    // de partager la même clé que "Solo Leveling" tout court (retour
    // utilisateur : "solo leveling apparait toujours 2 fois s1 et s2"). On
    // enlève tout ce qui suit un tiret précédé d'un espace en fin de titre.
    .replace(/\s+-.*$/, ' ')
    .toLowerCase()
    .replace(/[^a-z0-9]+/g, ' ')
    .trim();
  return base || raw.toLowerCase();
}

function _animeSortDate(a) {
  const d = a?.startDate;
  if (!d || !d.year) return Infinity; // date inconnue = classé en dernier
  return d.year * 10000 + (d.month || 0) * 100 + (d.day || 0);
}

// Renvoie "Saison N" quand le TITRE indique explicitement un numéro de
// saison ("Season 2", "2nd Season", "Final Season"), sinon null. On ne
// calcule plus jamais ce numéro par comptage/position — seul le texte du
// titre fait foi, donc une saison non postée ou mal ordonnée ne peut plus
// décaler le numéro d'une autre saison (bugs vécus sur Blue Lock et JoJo).
function _explicitSeasonLabel(anime) {
  const t = (anime?.title?.english || anime?.title?.romaji || '');
  const m = /\bseason\s+(\d+)\b/i.exec(t) || /\b(\d+)(?:st|nd|rd|th)\s+season\b/i.exec(t);
  if (m) return `Saison ${parseInt(m[1], 10)}`;
  if (/\bfinal\s+season\b/i.test(t)) return 'Saison Finale';
  return null;
}

// Nom court affiché pour une franchise "à parties nommées" (JoJo, où chaque
// entrée a son propre nom : "Stardust Crusaders", "Diamond is Unbreakable"…
// au lieu de "Season N") : le titre complet moins le préfixe commun de la
// franchise (tout ce qui précède le ":").
function _shortPartName(anime) {
  const raw = (anime?.title?.english || anime?.title?.romaji || '').trim();
  const colonIdx = raw.indexOf(':');
  return colonIdx > 0 ? raw.slice(colonIdx + 1).trim() : raw;
}

// Numéro de saison/partie extrait du TITRE (1 si aucun motif trouvé, donc
// "de base" par défaut). Sert de tri PRINCIPAL pour choisir quelle entrée
// d'une franchise représente le groupe (ex: garder "Solo Leveling" plutôt
// que "Solo Leveling Season 2 -Arise from the Shadow-") — plus fiable que
// de trier uniquement par date de sortie, qui peut être absente/incomplète
// selon les entrées et faisait parfois remonter une suite au lieu de la
// saison 1 (retour utilisateur : "blue lo" faisait apparaître Saison 2).
function _titleSeasonNumber(anime) {
  const t = (anime?.title?.english || anime?.title?.romaji || '');
  let m = /\bseason\s+(\d+)/i.exec(t) || /\b(\d+)(?:st|nd|rd|th)\s+season\b/i.exec(t) || /\bpart\s+(\d+)/i.exec(t) || /\bcour\s+(\d+)/i.exec(t);
  if (m) return parseInt(m[1], 10);
  if (/\bfinal\s+season\b/i.exec(t)) return 999;
  return 1;
}

// Choisit, pour chaque franchise (même clé que getFranchiseGroupKey), la
// meilleure entrée à afficher comme carte unique (saison 1 de préférence,
// triée par numéro de saison extrait du titre puis par date en dernier
// recours) — utilisé à la fois par l'accueil (rangées) et la recherche,
// pour ne jamais afficher deux fois la même franchise.
function dedupeFranchises(list) {
  const seenKeys = new Set();
  const groups = new Map();
  list.forEach((a) => {
    const key = getFranchiseGroupKey(a);
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(a);
  });
  const out = [];
  list
    .slice()
    .sort((a, b) => _titleSeasonNumber(a) - _titleSeasonNumber(b) || _animeSortDate(a) - _animeSortDate(b))
    .forEach((a) => {
      const key = getFranchiseGroupKey(a);
      if (seenKeys.has(key)) return;
      seenKeys.add(key);
      out.push(_franchiseRepresentative(a, groups.get(key)));
    });
  return out;
}

// Renvoie l'entrée à afficher pour représenter toute une franchise (carte
// unique dans l'accueil/recherche). Pour une franchise "à parties nommées"
// (aucune entrée ne dit "Season N" dans son titre, ex : JoJo), on affiche le
// nom GÉNÉRIQUE de la franchise ("JoJo's Bizarre Adventure"), pas le nom
// d'une partie précise ("...: Stardust Crusaders") — sinon on donne
// l'impression que la recherche n'a trouvé qu'UNE seule saison au lieu de
// regrouper toute la franchise postée (retour utilisateur : "tout les jojo
// sont regroupé sous le nom de stardust crusader"). Pour une franchise "à
// saisons numérotées" (Blue Lock), l'entrée retenue (saison 1) porte déjà
// le nom générique, donc rien à changer. On ne modifie que le TEXTE
// affiché — l'id et le reste des données restent ceux de l'entrée réelle
// choisie, donc le clic ouvre bien la bonne fiche/vidéo.
function _franchiseRepresentative(a, members) {
  if (!members || members.length < 2) return a;
  const isNumbered = members.some((m) => (m.format || 'TV') === 'TV' && _explicitSeasonLabel(m) != null);
  if (isNumbered) return a;
  const raw = a.title?.english || a.title?.romaji || '';
  const colonIdx = raw.indexOf(':');
  if (colonIdx <= 0) return a;
  const baseTitle = raw.slice(0, colonIdx).trim();
  if (!baseTitle) return a;
  return { ...a, title: { ...a.title, english: baseTitle, romaji: baseTitle } };
}

// Attribue à chaque membre d'une franchise le label affiché sur son badge
// ("Saison 1", "Stardust Crusaders", "Film"…), selon DEUX modes distincts
// (demande explicite, inspirée d'anime-sama) :
//  - Franchise "à saisons numérotées" (ex : Blue Lock — "BLUE LOCK", "BLUE
//    LOCK Season 2") : dès qu'UNE entrée TV de la franchise a un numéro de
//    saison explicite dans son titre, TOUTE la franchise passe en mode
//    numéroté. Chaque badge affiche alors le VRAI numéro lu directement
//    dans le titre de l'animé lui-même (pas un compteur de position) — donc
//    poster la saison 2 et la saison 4 d'une franchise affiche bien
//    "Saison 2" et "Saison 4", jamais "Saison 1"/"Saison 2" par accident.
//    L'entrée sans numéro dans son titre (la toute première saison) reçoit
//    "Saison 1".
//  - Franchise "à parties nommées" (ex : JoJo — "Stardust Crusaders",
//    "Diamond is Unbreakable"…, aucune de ses entrées ne dit "Season N") :
//    chaque badge affiche simplement le nom de la partie, dans l'ordre
//    chronologique, sans numéro du tout.
function labelFranchiseMembers(members, presorted) {
  // Si `members` est déjà dans le bon ordre (cas fiable : topoSortAnimeNodes
  // a utilisé les vraies relations PREQUEL/SEQUEL d'AniList, voir
  // fetchFranchiseChain), on ne re-trie surtout pas par titre/date — ce tri
  // de secours reste utilisé pour la passe instantanée (juste après un
  // clic, avant que la vraie réponse réseau arrive), qui ne connaît que le
  // titre/la date de chaque animé posté.
  const sorted = presorted
    ? members.slice()
    : members.slice().sort((a, b) => _titleSeasonNumber(a) - _titleSeasonNumber(b) || _animeSortDate(a) - _animeSortDate(b));
  const numberedMode = sorted.some((a) => (a.format || 'TV') === 'TV' && _explicitSeasonLabel(a) != null);
  let movie = 0, ova = 0, special = 0;
  return sorted.map((a) => {
    const fmt = a.format || 'TV';
    let label;
    if (fmt === 'MOVIE') {
      // Toujours "Film" (jamais un nom de partie) : on veut pouvoir le
      // repérer visuellement et le pousser en fin de rangée (voir
      // renderFranchiseBadges), quel que soit le mode.
      movie++; label = movie > 1 ? `Film ${movie}` : 'Film';
    } else if (numberedMode) {
      // Franchise "à saisons numérotées" : les OVA/spéciaux gardent leur
      // étiquette générique, seules les vraies saisons TV ont un numéro.
      if (fmt === 'OVA') { ova++; label = ova > 1 ? `OVA ${ova}` : 'OVA'; }
      else if (fmt !== 'TV') { special++; label = special > 1 ? `Spécial ${special}` : 'Spécial'; }
      else { label = _explicitSeasonLabel(a) || 'Saison 1'; }
    } else {
      // Franchise "à parties nommées" (JoJo) : un OVA/ONA/spécial a
      // généralement son propre nom bien identifiable ("OAV Rohan
      // Kishibe", "Steel Ball Run 2nd - 3rd STAGE"…) — l'étiqueter
      // "Spécial N" au lieu de son vrai nom l'aurait rendu impossible à
      // reconnaître dans la liste des badges (retour utilisateur : "Steel
      // Ball Run" affichait juste "Spécial 4"). Seuls les vrais films
      // gardent le libellé générique "Film" (branche au-dessus).
      label = _shortPartName(a);
    }
    return { anime: a, label };
  });
}

// ---------- Titres d'épisode ----------
// Un épisode peut avoir un titre à afficher au lieu de juste son numéro
// (ex: "Oingo (Khnum) et Boingo (Thoth)"). Ordre de préférence (demande
// explicite) :
//  1. Le serveur vidéo lui-même, s'il connaît déjà ce titre (lu depuis le
//     nom du fichier uploadé) — le plus fiable, dans la bonne langue.
//  2. AniList (streamingEpisodes), en dernier recours, si le serveur ne l'a
//     pas — approximatif (parfois absent/anglais).
//  3. Sinon on garde juste "Épisode N" comme aujourd'hui.
// On ne connaît pas encore le nom exact du champ que renverra le serveur
// vidéo, donc on essaie plusieurs noms plausibles.
function _entryEpisodeTitle(entry) {
  if (!entry || typeof entry !== 'object') return null;
  // "subtitle" retiré de la liste : sur ce serveur c'est en fait le CHEMIN
  // du fichier de sous-titres (ex: "/api/subtitle/210482/4"), pas un texte
  // de titre — ça s'affichait tel quel comme "titre" d'épisode par erreur
  // (retour utilisateur : "Épisode 4 : /api/subtitle/210482/4").
  const raw = entry.title || entry.episodeTitle || entry.epTitle || entry.name || null;
  let t = (raw || '').toString().trim();
  // Garde-fou : un vrai titre ne ressemble jamais à un chemin/URL de
  // fichier — si jamais un autre champ contient ça par erreur, on l'ignore
  // plutôt que de l'afficher tel quel.
  if (!t || /^\/|^https?:\/\/|\.(mp4|mkv|vtt|srt|ass|webvtt|m3u8)(\?|$)/i.test(t)) return null;
  // Beaucoup de fichiers/métadonnées incluent déjà le numéro d'épisode dans
  // le titre lui-même (ex: "S01E01 - L'as de l'escroquerie", "EP01 - ...",
  // "01. ..."), ce qui donnait "Épisode 1 : S01E01 - ..." une fois affiché
  // avec le préfixe qu'on ajoute nous-mêmes — on retire ce préfixe redondant.
  t = t.replace(/^\s*(?:s\d{1,2}\s*)?e(?:p(?:isode)?)?\.?\s*\d{1,4}\s*[-:.]*\s*/i, '')
       .replace(/^\s*\d{1,4}\s*[-:.]\s*/, '')
       .trim();
  if (!t) return null;
  return t;
}

// Cache persistant des titres d'épisode FR trouvés sur Wikipédia (voir
// fetchFrenchWikipediaEpisodeTitles) — évite de refaire la recherche +
// l'analyse de la page à chaque reload.
// v2 : invalide l'ancien cache qui pouvait contenir du CSS/"Pas de
// traduction officielle" capturés par erreur comme "titre" (voir fix ci-
// dessus, _extractWikiCellTitle) — sans ce changement de clé, les fiches
// déjà visitées garderaient ces titres pollués en cache indéfiniment.
const EP_TITLE_WIKI_LS_KEY = 'adn_ep_title_wiki_cache_v3';
let _epTitleWikiCache = null;
function _loadEpTitleWikiCache() {
  if (_epTitleWikiCache) return _epTitleWikiCache;
  try {
    _epTitleWikiCache = JSON.parse(localStorage.getItem(EP_TITLE_WIKI_LS_KEY) || '{}');
  } catch {
    _epTitleWikiCache = {};
  }
  return _epTitleWikiCache;
}
let _epTitleWikiSaveTimer = null;
function _scheduleSaveEpTitleWikiCache() {
  if (_epTitleWikiSaveTimer) return;
  _epTitleWikiSaveTimer = setTimeout(() => {
    _epTitleWikiSaveTimer = null;
    try {
      localStorage.setItem(EP_TITLE_WIKI_LS_KEY, JSON.stringify(_epTitleWikiCache || {}));
    } catch {
      // stockage indisponible : on referas juste la recherche à chaque
      // session, tant pis.
    }
  }, 1500);
}

// Nettoie un texte de cellule de tableau Wikipédia : retire les appels de
// note ("[1]", "[note 1]"), les guillemets français encadrants et les
// espaces/retours à la ligne en trop.
function _cleanWikiCellText(text) {
  return (text || '')
    .replace(/\[\s*\d+\s*\]/g, '')
    .replace(/\[\s*note\s*\d+\s*\]/gi, '')
    .replace(/^[«"“]\s*/, '')
    .replace(/\s*[»"”]$/, '')
    .replace(/\s+/g, ' ')
    .trim();
}

// Lit le titre FR d'une cellule de tableau Wikipédia. Deux pièges observés
// en pratique (retour utilisateur : "ya un lien et yen a avec ecris pas de
// traduction au lieu de soit langlaise soit rien") :
//  1. Certains modèles Wikipédia ("non traduit", etc.) injectent une balise
//     <style> DANS la cellule — .textContent brut remonte alors tout le CSS
//     en clair avant le texte utile. On enlève <style>/<script>/footnotes
//     d'une copie de la cellule avant de lire le texte.
//  2. Quand il n'existe pas de titre français officiel, la cellule contient
//     littéralement "Pas de traduction officielle" (ou variantes) — ce n'est
//     pas un titre, on le traite comme une absence de titre (repli AniList).
function _extractWikiCellTitle(cellEl) {
  // Certaines pages mettent un 2e titre (variante/nom réel, ex. un nom de
  // groupe/personnalité renommé pour raisons légales) sur une 2e ligne DANS
  // LA MÊME cellule, entre parenthèses, séparée par un <br> (ex. "Mary Lynn
  // Manson, le recouvreur de dettes" puis "(Marilyn Manson, le recouvreur
  // de dettes)") — retour utilisateur : "yen a ou c en double". Sans
  // découper sur ce <br>, les deux lignes se concaténaient en un seul titre
  // bancal. On ne garde donc que ce qui précède le premier <br>.
  let html = cellEl.innerHTML;
  const brIdx = html.search(/<br\s*\/?>/i);
  if (brIdx !== -1) html = html.slice(0, brIdx);
  const temp = document.createElement('div');
  temp.innerHTML = html;
  temp.querySelectorAll('style, script, sup.reference, .reference, .mw-editsection').forEach((el) => el.remove());
  const text = _cleanWikiCellText(temp.textContent);
  if (!text) return null;
  if (/pas de traduction|sans traduction|titre (fran[çc]ais\s*)?inconnu|non traduit/i.test(text)) return null;
  return text;
}

// Cherche sur Wikipédia FR la page "Liste des épisodes de ..." correspondant
// à `anime`, et renvoie son titre exact de page, ou null si rien de
// pertinent trouvé. Utilise l'API MediaWiki (CORS ouvert via origin=*, pas
// besoin de passer par notre serveur).
async function _findFrenchWikiEpisodeListPage(anime) {
  const titleCandidates = [anime.title?.english, anime.title?.romaji].filter(Boolean);
  for (const baseTitle of titleCandidates) {
    try {
      const searchUrl = `https://fr.wikipedia.org/w/api.php?action=query&list=search&srsearch=${encodeURIComponent('Liste des épisodes de ' + baseTitle)}&format=json&origin=*&srlimit=5`;
      const res = await Promise.race([
        fetch(searchUrl),
        new Promise((_, reject) => setTimeout(() => reject(new Error('timeout')), 4000)),
      ]);
      if (!res.ok) continue;
      const data = await res.json();
      const results = data?.query?.search || [];
      const hit = results.find((r) => /^liste des épisodes de/i.test(r.title));
      if (hit) return hit.title;
    } catch {
      // on essaie le prochain titre candidat (romaji après english, etc.)
    }
  }
  return null;
}

// Va chercher et parse le tableau d'épisodes d'une page Wikipédia FR trouvée
// par _findFrenchWikiEpisodeListPage, et renvoie une Map numéro -> titre FR
// (ou null si rien d'exploitable). Jamais bloquant/fatal : toute erreur
// (page absente, tableau pas au format attendu, etc.) renvoie juste null,
// pour retomber proprement sur AniList (voir fetchEpisodeTitlesFromAniList).
async function _parseFrenchWikiEpisodeTitles(pageTitle) {
  try {
    const url = `https://fr.wikipedia.org/w/api.php?action=parse&page=${encodeURIComponent(pageTitle)}&prop=text&format=json&origin=*`;
    const res = await Promise.race([
      fetch(url),
      new Promise((_, reject) => setTimeout(() => reject(new Error('timeout')), 6000)),
    ]);
    if (!res.ok) return null;
    const data = await res.json();
    const html = data?.parse?.text?.['*'];
    if (!html) return null;
    const doc = new DOMParser().parseFromString(html, 'text/html');
    const tables = doc.querySelectorAll('table.wikitable');
    const map = new Map();
    tables.forEach((table) => {
      const headerCells = Array.from(table.querySelectorAll('tr:first-child th, tr:first-child td'))
        .map((th) => _cleanWikiCellText(th.textContent).toLowerCase());
      if (!headerCells.length) return;
      // Colonne du titre FR : "titre français"/"titre vf"/"titre", en
      // évitant "titre original"/"titre japonais"/"titre vo".
      let titleCol = headerCells.findIndex((h) => /titre/.test(h) && /fran|vf/.test(h));
      if (titleCol === -1) {
        titleCol = headerCells.findIndex((h) => /^titre$/.test(h));
      }
      if (titleCol === -1) return; // pas de colonne de titre exploitable
      // Colonne du numéro : "n°", "numéro", "épisode" — sinon on prend la
      // toute première colonne (presque toujours le numéro sur ces pages).
      let numCol = headerCells.findIndex((h) => /^n°|numéro|épisode/.test(h));
      if (numCol === -1) numCol = 0;

      table.querySelectorAll('tr').forEach((row, rowIdx) => {
        if (rowIdx === 0) return; // ligne d'en-tête déjà traitée
        const cells = row.querySelectorAll('td, th');
        if (!cells[numCol] || !cells[titleCol]) return;
        const numText = _cleanWikiCellText(cells[numCol].textContent);
        const numMatch = /\d+/.exec(numText);
        if (!numMatch) return;
        const num = parseInt(numMatch[0], 10);
        const title = _extractWikiCellTitle(cells[titleCol]);
        if (title) map.set(num, title);
      });
    });
    return map.size ? map : null;
  } catch {
    return null;
  }
}

// Point d'entrée : titres FR officiels via Wikipédia si trouvés (voir
// demande explicite "les noms des episodes sont en anglais au lieu de fr" —
// vérifié : AniList n'a que l'anglais, Wikipédia FR a souvent les vrais
// titres VF), avec cache persistant ; sinon null (le code appelant retombe
// sur AniList, en anglais, comme avant).
async function fetchFrenchWikipediaEpisodeTitles(anime) {
  const wikiCache = _loadEpTitleWikiCache();
  const animeKey = String(anime.id);
  if (wikiCache[animeKey]) {
    // 'none' = déjà cherché, rien trouvé la dernière fois — évite de
    // refaire la recherche/le parsing à chaque ouverture de fiche.
    if (wikiCache[animeKey] === 'none') return null;
    return new Map(Object.entries(wikiCache[animeKey]).map(([k, v]) => [parseInt(k, 10), v]));
  }
  const pageTitle = await _findFrenchWikiEpisodeListPage(anime);
  const map = pageTitle ? await _parseFrenchWikiEpisodeTitles(pageTitle) : null;
  wikiCache[animeKey] = map ? Object.fromEntries(map) : 'none';
  _scheduleSaveEpTitleWikiCache();
  return map;
}

const _episodeTitlesCache = {};
// Titres d'épisode affichés dans la grille : Wikipédia FR en priorité (vrais
// titres officiels), sinon repli sur AniList (streamingEpisodes, en
// anglais) comme avant — jamais bloquant, jamais fatal si les deux sources
// échouent (on garde juste "Épisode N").
function fetchEpisodeTitlesFromAniList(anime) {
  if (_episodeTitlesCache[anime.id]) return _episodeTitlesCache[anime.id];
  const promise = (async () => {
    const wikiMap = await fetchFrenchWikipediaEpisodeTitles(anime);
    if (wikiMap) return wikiMap;

    const query = `query($id:Int){Media(id:$id,type:ANIME){streamingEpisodes{title}}}`;
    try {
      const res = await Promise.race([
        fetch(`${API_BASE}/api/anilist`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ query, variables: { id: anime.id } }),
        }),
        new Promise((_, reject) => setTimeout(() => reject(new Error('timeout')), 4000)),
      ]);
      if (!res.ok) return null;
      const data = await res.json();
      const episodes = data?.data?.Media?.streamingEpisodes || [];
      const map = new Map();
      episodes.forEach((ep) => {
        // Format habituel AniList : "Episode 12 - Le vrai titre". On ne
        // garde que les entrées où on peut extraire un numéro fiable.
        const m = /^(?:episode|ep)?\.?\s*(\d+)\s*[-:.]\s*(.+)$/i.exec((ep?.title || '').trim());
        if (m) map.set(parseInt(m[1], 10), m[2].trim());
      });
      return map.size ? map : null;
    } catch {
      return null;
    }
  })();
  _episodeTitlesCache[anime.id] = promise;
  return promise;
}

// Va chercher (une seule fois par animé) les titres AniList et met à jour
// tous les éléments marqués `data-ep-titleable` dans `container` qui
// n'avaient pas déjà un titre fourni par le serveur vidéo lui-même.
function applyEpisodeTitlesAsync(anime, container) {
  fetchEpisodeTitlesFromAniList(anime).then((map) => {
    if (!map) return;
    container.querySelectorAll('[data-ep-titleable="1"]').forEach((el) => {
      const num = parseInt(el.dataset.epNumber, 10);
      const title = map.get(num);
      if (title) el.textContent = `Épisode ${num} : ${title}`;
    });
  });
}

// Retourne les membres de la franchise de `anime` (dont lui-même) selon
// l'heuristique par titre — instantané mais limité (ne fonctionne pas pour
// les franchises dont les parties n'ont pas de nom en commun, ex: JoJo).
function getFranchiseMembers(anime, pool) {
  const key = getFranchiseGroupKey(anime);
  const members = pool.filter((a) => getFranchiseGroupKey(a) === key);
  return labelFranchiseMembers(members);
}

// Version fiable basée sur le vrai graphe de relations AniList. On suit
// PREQUEL/SEQUEL (toujours), plus SIDE_STORY/PARENT mais SEULEMENT quand
// l'animé lié est un FILM — c'est ainsi qu'AniList relie un film canon à sa
// série (ex : le film Blue Lock -EPISODE NAGI-, lié à "BLUE LOCK" par
// PARENT/SIDE_STORY, jamais SEQUEL) — voir demande explicite "et aussi les
// films si yen a". On exclut volontairement SIDE_STORY/PARENT pour tout ce
// qui n'est PAS un film (les vrais spin-offs sans rapport de ton, ex :
// "Attack on Titan: Junior High", lié à AoT par PARENT mais en format TV —
// c'est justement le bug vécu qu'on ne veut pas réintroduire).
// On récupère aussi format/date/titre de chaque animé lié : nécessaire pour
// numéroter les saisons selon leur VRAIE place dans la franchise (voir
// fetchFranchiseChain plus bas), même quand cet animé n'est pas posté sur le
// site. On récupère également, pour l'animé `id` lui-même, le numéro de
// partie officiel indiqué par sa fiche manga SOURCE quand elle en a un (ex :
// "JoJo's Bizarre Adventure Part 3: Stardust Crusaders" -> 3).
const _relationsCache = {};
async function fetchAnimeRelations(id) {
  if (_relationsCache[id]) return _relationsCache[id];
  const query = `query($id:Int){Media(id:$id,type:ANIME){id format relations{edges{relationType(version:2) node{id type format startDate{year month day} title{romaji english}}}}}}`;
  try {
    const res = await fetch(`${API_BASE}/api/anilist`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ query, variables: { id } }),
    });
    if (!res.ok) return (_relationsCache[id] = { neighbors: [], partNumber: null });
    const data = await res.json();
    const ownFormat = data?.data?.Media?.format;
    const edges = data?.data?.Media?.relations?.edges || [];
    // On garde le `relationType` de chaque voisin (pas juste le noeud) : il
    // sert à FIXER LA VRAIE POSITION chronologique de chaque animé dans
    // fetchFranchiseChain (PREQUEL/SEQUEL), plutôt que de la deviner via le
    // titre ou une date — les deux se sont révélées peu fiables (une saison
    // sans date connue, ou une date carrément fausse/dupliquée côté AniList,
    // pouvait faire sauter ou inverser un numéro de saison, voir retours
    // utilisateur sur Blue Lock/JoJo).
    const neighbors = edges
      .filter((e) => {
        if (e?.node?.type !== 'ANIME') return false;
        if (e.relationType === 'PREQUEL' || e.relationType === 'SEQUEL') return true;
        // SIDE_STORY/PARENT : suivi seulement quand l'un des deux bouts (cet
        // animé ou celui pointé) est un FILM — sens obligatoire dans les deux
        // directions, sinon un film ne pourrait jamais "revenir" vers sa
        // série d'origine pendant le parcours (voir fetchFranchiseChain).
        if (e.relationType === 'SIDE_STORY' || e.relationType === 'PARENT') {
          return ownFormat === 'MOVIE' || e.node.format === 'MOVIE';
        }
        return false;
      })
      .map((e) => ({ node: e.node, relationType: e.relationType }));
    let partNumber = null;
    for (const e of edges) {
      if (e?.relationType !== 'SOURCE' || e?.node?.type !== 'MANGA') continue;
      const t = e.node.title?.english || e.node.title?.romaji || '';
      const m = t.match(/\bpart\s+(\d+)\b/i);
      if (m) { partNumber = parseInt(m[1], 10); break; }
    }
    return (_relationsCache[id] = { neighbors, partNumber });
  } catch (e) {
    return (_relationsCache[id] = { neighbors: [], partNumber: null });
  }
}

// Parcours en largeur du graphe PREQUEL/SEQUEL à partir de `anime`. Retourne
// { full, posted } :
//  - `full`  : TOUS les animés de la franchise trouvés, postés ou non, déjà
//              triés dans le VRAI ordre chronologique — sert à calculer le
//              vrai numéro de saison de chacun (ex : Stardust Crusaders doit
//              rester "Saison 3", même si les saisons 1 et 2 ne sont pas
//              postées sur le site).
//  - `posted`: le sous-ensemble de `full` réellement posté sur le site (voir
//              `pool`, le catalogue local) — c'est ce sous-ensemble qu'on
//              affiche, mais en gardant le numéro calculé sur `full`.
// On parcourt le graphe en entier même à travers des animés non postés (ex :
// "1st STAGE" de Steel Ball Run n'est pas posté, mais relie quand même
// "2nd - 3rd STAGE" au reste de la saga JoJo) — sinon deux animés bien
// postés mais séparés par un maillon manquant ne seraient jamais regroupés
// (bug vécu avec "jojo").
//
// Pour ORDONNER les animés trouvés, on utilise directement les relations
// PREQUEL/SEQUEL du graphe (tri topologique) au lieu de deviner via le
// titre ou la date de sortie — ces deux dernières se sont montrées peu
// fiables : une saison à venir n'a souvent pas encore de date connue, et il
// arrive qu'AniList renvoie une date fausse/dupliquée (ex : "BLUE LOCK
// Season 2" listée avec la même date que la Saison 1) — ce qui décalait ou
// inversait les numéros de saison (retours utilisateur sur Blue Lock/JoJo).
// Un lien SEQUEL de X vers Y veut dire "Y vient après X" ; un lien PREQUEL
// de X vers Y veut dire "Y vient avant X". La date ne sert plus qu'en tout
// dernier recours, pour départager des animés sans aucun lien direct entre
// eux (ex : plusieurs films détachés du fil principal).
async function fetchFranchiseChain(anime, pool) {
  const byId = new Map(pool.map((a) => [a.id, a]));
  const allNodes = new Map([[anime.id, byId.get(anime.id) || anime]]);
  // comesBefore.get(x) = Set des ids qui doivent apparaître APRÈS x.
  const comesBefore = new Map();
  const addOrder = (beforeId, afterId) => {
    if (!comesBefore.has(beforeId)) comesBefore.set(beforeId, new Set());
    comesBefore.get(beforeId).add(afterId);
  };
  let frontier = [anime.id];
  let steps = 0;
  while (frontier.length > 0 && steps < 24) {
    steps++;
    const next = [];
    for (const id of frontier) {
      const { neighbors } = await fetchAnimeRelations(id);
      for (const { node, relationType } of neighbors) {
        if (relationType === 'SEQUEL') addOrder(id, node.id);
        else if (relationType === 'PREQUEL') addOrder(node.id, id);
        if (allNodes.has(node.id)) continue;
        // Préfère la version complète du catalogue local si elle existe
        // (cohérente avec le reste du site), sinon la version minimale
        // renvoyée par la requête de relations (juste de quoi trier/nommer).
        allNodes.set(node.id, byId.get(node.id) || node);
        next.push(node.id);
      }
    }
    frontier = next;
  }
  const ordered = topoSortAnimeNodes([...allNodes.values()], comesBefore);
  // Certaines saisons sont scindées par AniList en plusieurs entrées TV
  // séparées mais liées par SEQUEL (un "cours" par entrée) — ex : "Stardust
  // Crusaders" et "Stardust Crusaders - Battle in Egypt" sont EN VRAI la
  // même saison de l'animé, juste diffusée en 2 parties. Sans fusion, la
  // 2e partie (même quand elle n'est pas postée séparément) consommait un
  // numéro de saison en plus et décalait tout ce qui suit (retour
  // utilisateur : JoJo affichait "Saison 2, 4, 5" au lieu de numéros
  // consécutifs).
  const full = mergeCourSplits(ordered, new Set(pool.map((a) => a.id)));
  const posted = full.filter((a) => byId.has(a.id));
  return { full, posted };
}

// Fusionne deux entrées TV consécutives quand l'une est manifestement la
// suite/partie 2 de l'autre dans le MÊME arc (le titre de la 2e commence
// par celui de la 1re, ex: "X" puis "X - Battle in Egypt") — on ne compare
// que des voisins directs dans l'ordre déjà calculé, et seulement entre
// deux formats TV (un film/OVA ne doit jamais absorber une saison).
function mergeCourSplits(list, postedIds) {
  const result = [];
  for (const a of list) {
    const fmt = a.format || 'TV';
    const prev = result[result.length - 1];
    if (fmt === 'TV' && prev && (prev.format || 'TV') === 'TV') {
      const ta = (a.title?.english || a.title?.romaji || '').toLowerCase().trim();
      const tp = (prev.title?.english || prev.title?.romaji || '').toLowerCase().trim();
      if (tp.length > 3 && ta.length > 3 && (ta.startsWith(tp) || tp.startsWith(ta))) {
        // Garde la version postée si l'une des deux l'est.
        if (!postedIds.has(prev.id) && postedIds.has(a.id)) result[result.length - 1] = a;
        continue;
      }
    }
    result.push(a);
  }
  return result;
}

// Tri topologique (Kahn) des animés selon les contraintes PREQUEL/SEQUEL
// réelles trouvées dans le graphe — la date de sortie ne sert qu'à
// départager les animés qui n'ont, entre eux, aucune contrainte d'ordre
// connue (ex : deux films indépendants du fil principal).
function topoSortAnimeNodes(nodes, comesBefore) {
  const ids = new Set(nodes.map((a) => a.id));
  const byId = new Map(nodes.map((a) => [a.id, a]));
  const inDegree = new Map(nodes.map((a) => [a.id, 0]));
  const after = new Map(nodes.map((a) => [a.id, []]));
  comesBefore.forEach((afters, beforeId) => {
    if (!ids.has(beforeId)) return;
    afters.forEach((afterId) => {
      if (!ids.has(afterId)) return;
      after.get(beforeId).push(afterId);
      inDegree.set(afterId, (inDegree.get(afterId) || 0) + 1);
    });
  });
  const byDate = (id1, id2) => _animeSortDate(byId.get(id1)) - _animeSortDate(byId.get(id2));
  let ready = nodes.filter((a) => inDegree.get(a.id) === 0).map((a) => a.id).sort(byDate);
  const order = [];
  const done = new Set();
  while (ready.length) {
    ready.sort(byDate);
    const id = ready.shift();
    if (done.has(id)) continue;
    done.add(id);
    order.push(id);
    after.get(id).forEach((afterId) => {
      inDegree.set(afterId, inDegree.get(afterId) - 1);
      if (inDegree.get(afterId) === 0 && !done.has(afterId)) ready.push(afterId);
    });
  }
  // Cas résiduel (cycle improbable, ou noeud jamais débloqué) : on l'ajoute
  // quand même, trié par date, plutôt que de le faire disparaître.
  nodes.forEach((a) => { if (!done.has(a.id)) { order.push(a.id); done.add(a.id); } });
  return order.map((id) => byId.get(id));
}

// Rend la rangée de badges "Saison 1 / Saison 2 / Film…" pour `currentAnime`.
// `chain` est soit un tableau brut de membres postés (passe instantanée par
// titre — on ne connaît alors que ce qui est posté), soit un objet
// { full, posted } renvoyé par fetchFranchiseChain (passe fiable par
// relations : la numérotation se base sur `full`, l'affichage se limite à
// `posted`).
//
// On numérote sur `full` (tous les animés TV de la franchise trouvés via
// AniList, postés ou non) et pas seulement sur `posted`, pour garder le
// bon numéro même quand une saison plus ancienne n'est pas postée — ex :
// JoJo, où "Phantom Blood" et "Battle Tendency" sont deux vraies saisons
// TV distinctes sur AniList mais jamais postées ici : Stardust Crusaders
// doit rester "Saison 3", pas redevenir "Saison 1" juste parce qu'on ne
// l'a pas postée (retour utilisateur explicite). Seul le format TV compte
// comme une vraie saison (voir labelFranchiseMembers) — un film/OVA/
// spécial/recap non posté ne doit PAS décaler la numérotation (c'était le
// bug sur Blue Lock : un contenu annexe non-saison comptait comme saison).
function renderFranchiseBadges(currentAnime, chain) {
  const franchiseRow = document.getElementById('detailFranchiseRow');
  if (!franchiseRow) return;
  const isChainObject = !Array.isArray(chain);
  const { full, posted } = isChainObject ? chain : { full: chain, posted: chain };
  const postedIds = new Set(posted.map((a) => a.id));
  // DEBUG : affiche dans la console (F12) l'ordre final retenu pour cette
  // franchise — pratique pour vérifier/diagnostiquer un souci de
  // numérotation sans avoir à republier le site à chaque essai.
  if (isChainObject) {
    const debugLines = full.map((a) => {
      const d = a.startDate;
      const dateStr = d && d.year ? `${d.year}-${String(d.month || 0).padStart(2, '0')}-${String(d.day || 0).padStart(2, '0')}` : '?';
      return `  id=${a.id} | ${a.format || 'TV'} | posté=${postedIds.has(a.id) ? 'oui' : 'non'} | ${dateStr} | ${a.title?.english || a.title?.romaji}`;
    });
    console.log(
      `[franchise-debug] ${currentAnime.title?.english || currentAnime.title?.romaji}\n${debugLines.join('\n')}`
    );
  }
  // `full` est déjà dans le bon ordre (tri topologique via les relations
  // PREQUEL/SEQUEL, voir fetchFranchiseChain) quand `chain` vient de la
  // passe fiable — presorted=true pour ne pas l'écraser par un tri
  // titre/date de secours.
  const list = labelFranchiseMembers(full, isChainObject).filter(({ anime: a }) => postedIds.has(a.id));
  // Affichage : toutes les saisons/parties d'abord (dans l'ordre
  // chronologique déjà calculé), PUIS les FILMS à la fin — même si un film
  // est sorti chronologiquement ENTRE deux saisons, on ne veut pas qu'il
  // s'intercale dans la rangée de badges (demande explicite). Les OVA/
  // spéciaux, eux, RESTENT à leur place chronologique : dans une franchise
  // "à parties nommées" ils ont leur propre nom identifiable (ex : "OAV
  // Rohan Kishibe" entre deux saisons JoJo, comme sur anime-sama) — les
  // pousser en fin de rangée les rendrait aussi peu clairs qu'un "Spécial
  // N" perdu tout seul à la fin.
  const rank = (fmt) => (fmt === 'MOVIE' ? 1 : 0);
  list.sort((x, y) => rank(x.anime.format) - rank(y.anime.format));
  franchiseRow.innerHTML = '';
  if (list.length > 1) {
    franchiseRow.style.display = '';
    list.forEach(({ anime: member, label }) => {
      const badge = document.createElement('button');
      badge.className = 'franchise-badge' + (member.id === currentAnime.id ? ' active' : '');
      badge.textContent = label;
      badge.onclick = () => {
        // Déjà dans la fiche détail : on reconstruit juste son contenu pour
        // la nouvelle saison/film, sans rejouer toute l'animation d'ouverture
        // (overlay + zoom) prévue pour venir de l'accueil.
        if (member.id === detailCurrentAnime?.id) return;
        detailCurrentAnime = member;
        detailSelectedLanguage = 'vostfr';
        // Tout de suite, sans attendre le logo (voir openDetail) — le titre
        // texte s'affiche en attendant, le logo le remplace dès que prêt.
        buildDetailView(member);
        window.scrollTo(0, 0);
      };
      franchiseRow.appendChild(badge);
    });
  } else {
    franchiseRow.style.display = 'none';
  }
}

function _cleanDescription(desc) {
  return (desc || '')
    .replace(/<br\s*\/?>/gi, '\n')
    .replace(/<[^>]*>/g, '')
    .replace(/\n/g, ' ')
    .trim() || 'Pas de description disponible.';
}
async function fetchFrenchSynopsis(anime) {
  if (_frenchSynopsisCache[anime.id]) return _frenchSynopsisCache[anime.id];
  const fallback = _cleanDescription(anime.description);
  try {
    const res = await fetch(`${API_BASE}/api/synopsis-fr`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        animeId: anime.id,
        title: anime.title?.english || anime.title?.romaji,
        titleRomaji: anime.title?.romaji,
        format: anime.format,
        fallback,
      }),
    });
    if (!res.ok) return fallback;
    const data = await res.json();
    const synopsis = (data?.synopsis || '').trim();
    if (!synopsis) return fallback;
    _frenchSynopsisCache[anime.id] = synopsis;
    return synopsis;
  } catch {
    return fallback;
  }
}

async function fetchServerVideos(animeId) {
  try {
    const res = await fetch(`${API_BASE}/api/videos/${animeId}`);
    if (!res.ok) return {};
    const data = await res.json();
    return data && typeof data === 'object' ? data : {};
  } catch {
    return {};
  }
}

// Concurrence plafonnée, comme côté Flutter — même raison : ne pas bombarder
// le serveur/AniList d'un coup.
// `onProgress(partialResults)` (optionnel) est appelé au fil de l'eau, avec
// le tableau `results` tel qu'il est à cet instant (trous compris pour les
// éléments pas encore résolus) — permet d'afficher les premières rangées
// avant que TOUT le catalogue soit chargé, plutôt que de rester sur l'écran
// de chargement le temps des ~270 requêtes.
async function mapWithConcurrency(items, limit, fn, onProgress) {
  const results = new Array(items.length);
  let i = 0;
  let done = 0;
  async function worker() {
    while (i < items.length) {
      const idx = i++;
      results[idx] = await fn(items[idx], idx);
      done++;
      if (onProgress) onProgress(results, done, items.length);
    }
  }
  await Promise.all(Array.from({ length: Math.min(limit, items.length) }, worker));
  return results;
}

let heroSlides = [];
let heroIndex = 0;
let heroTimer = null;

function renderHero() {
  const hero = document.getElementById('hero');
  hero.innerHTML = '';
  if (heroSlides.length === 0) {
    document.getElementById('heroEmpty').style.display = 'block';
    hero.appendChild(document.getElementById('heroEmpty'));
    return;
  }

  heroSlides.forEach((anime, idx) => {
    const slide = document.createElement('div');
    slide.className = 'hero-slide' + (idx === heroIndex ? ' active' : '');
    slide.dataset.idx = idx;
    slide.dataset.animeId = anime.id;

    const img = document.createElement('img');
    img.className = 'banner';
    img.loading = idx === 0 ? 'eager' : 'lazy';
    img.src = anime.bannerImage || anime.coverImage?.extraLarge || '';
    slide.appendChild(img);

    const grad = document.createElement('div');
    grad.className = 'hero-gradient';
    slide.appendChild(grad);

    const content = document.createElement('div');
    content.className = 'hero-content';
    const titleText = anime.title?.english || anime.title?.romaji || '';
    if (anime._logoUrl) {
      // Texte de titre affiché tout de suite (jamais de trou visuel), logo
      // préchargé en arrière-plan et substitué seulement une fois COMPLET
      // (voir loadLogoImg) — jamais un <img> avec juste `src` posé, qui
      // s'affiche progressivement au fur et à mesure du téléchargement.
      const h1 = document.createElement('h1');
      h1.className = 'hero-title-text';
      h1.textContent = titleText;
      content.appendChild(h1);
      loadLogoImg(anime._logoUrl, 'hero-logo-img', titleText, (img) => {
        if (h1.isConnected) h1.replaceWith(img);
      });
    } else {
      const h1 = document.createElement('h1');
      h1.className = 'hero-title-text';
      h1.textContent = titleText;
      content.appendChild(h1);
    }

    if (anime.genres?.length) {
      const genresEl = document.createElement('p');
      genresEl.className = 'hero-genres';
      genresEl.textContent = anime.genres.slice(0, 3).map(translateGenre).join(' • ');
      content.appendChild(genresEl);
    }

    const desc = document.createElement('p');
    desc.className = 'hero-desc';
    desc.textContent = _cleanDescription(anime.description);
    content.appendChild(desc);
    fetchFrenchSynopsis(anime).then((text) => {
      // Le carrousel peut avoir tourné entre-temps : on vérifie que ce
      // slide-là est toujours dans le DOM avant de le mettre à jour.
      if (desc.isConnected) desc.textContent = text;
    });

    const actions = document.createElement('div');
    actions.className = 'hero-actions';
    const heroProgress = watchProgress.get(anime.id);
    const playBtn = document.createElement('button');
    playBtn.className = 'btn btn-primary';
    playBtn.innerHTML = heroProgress ? `▶ REPRENDRE ÉP. ${heroProgress.episode}` : '▶ LECTURE E1';
    playBtn.onclick = (e) => {
      e.stopPropagation();
      const epNumber = heroProgress ? heroProgress.episode : (anime.format === 'MOVIE' ? 0 : 1);
      fetchServerVideos(anime.id).then((videos) => {
        detailCurrentVideos = videos;
        const entry = videos[epNumber];
        if (!entry || !entry.video) {
          toast("Cette vidéo n'est pas encore disponible.");
          openDetail(anime, slide.querySelector('img.banner'));

      });

    const infoBtn = document.createElement('button');

    infoBtn.innerHTML = 'ⓘ Infos';

    actions.appendChild(infoBtn);

  const leftArrow = document.createElement('button');

  rightArrow.className = 'hero-arrow right';
  rightArrow.innerHTML = '&#8250;';
  rightArrow.onclick = () => goToHeroSlide((heroIndex + 1) % heroSlides.length);
  hero.appendChild(rightArrow);

// Remplace le titre texte d'UNE slide du bandeau par son logo une fois
// récupéré, sans reconstruire tout le carrousel (voir renderHero) — évite le
// flash/"rechargement" qui se produisait avant en rappelant renderHero() à
// chaque logo prêt (jusqu'à 6 reconstructions complètes du bandeau).
function updateHeroSlideLogo(anime) {
  const slide = document.querySelector(`.hero-slide[data-anime-id="${anime.id}"]`);
  if (!slide) return;
  const titleEl = slide.querySelector('.hero-title-text');
  if (!titleEl) return; // déjà un logo, ou slide plus dans le DOM
  loadLogoImg(anime._logoUrl, 'hero-logo-img', titleEl.textContent, (img) => {
    if (titleEl.isConnected) titleEl.replaceWith(img);
  });
}

function goToHeroSlide(idx) {
  heroIndex = idx;
  document.querySelectorAll('.hero-slide').forEach((el) => {
    el.classList.toggle('active', Number(el.dataset.idx) === idx);
  });
  document.querySelectorAll('.progress-seg-fill').forEach((el, i) => {
    el.classList.toggle('active', i === idx);
  });
  restartHeroAutoplay();
}

function restartHeroAutoplay() {
  clearInterval(heroTimer);
  if (heroSlides.length <= 1) return;
  // Même cadence que le carrousel Flutter (7s).
  heroTimer = setInterval(() => {
    goToHeroSlide((heroIndex + 1) % heroSlides.length);
  }, 7000);
}

// Construit UNE carte (jaquette). `opts.continueWatching` (optionnel) =
// { episode, fraction, onRemove } bascule la carte en variante
// "Continuer à regarder" (_ContinueWatchingCard) : pas de marque-page, mais
// une croix pour retirer + une barre "Épisode N" + une barre de progression,
// toutes deux TOUJOURS visibles (pas seulement au survol).
function createCardElement(anime, opts = {}) {
  const cw = opts.continueWatching;
  const titleText = anime.title?.english || anime.title?.romaji || '';

  const card = document.createElement('div');
  card.className = 'card';
  card.style.animationDelay = Math.min((opts.delay || 0), 250) + 'ms';
  card.onclick = () => openDetail(anime, card.querySelector('.card-poster'));

  const posterWrap = document.createElement('div');
  posterWrap.className = 'card-poster-wrap';

  const poster = document.createElement('div');
  poster.className = 'card-poster';

  const img = document.createElement('img');
  img.loading = 'lazy';
  img.src = anime.coverImage?.large || anime.coverImage?.extraLarge || '';
  img.alt = anime.title?.romaji || '';
  poster.appendChild(img);

  // VOSTFR (toujours) + VF (si dispo) — badges en haut à gauche, TOUJOURS
  // visibles, comme _LanguageAvailabilityBadges côté Flutter.
  const badgeRow = document.createElement('div');
  badgeRow.className = 'badge-row';
  const vostfr = document.createElement('span');
  vostfr.className = 'badge-pill badge-vostfr';
  vostfr.textContent = 'VOSTFR';
  badgeRow.appendChild(vostfr);
  poster.appendChild(badgeRow);

  if (cw) {
    // Croix "retirer" en haut à droite (remplace le marque-page ici).
    const removeBtn = document.createElement('button');
    removeBtn.className = 'cw-remove';
    removeBtn.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg>';
    removeBtn.onclick = (e) => { e.stopPropagation(); opts.onRemove?.(); };
    poster.appendChild(removeBtn);

    const bottomBar = document.createElement('div');
    bottomBar.className = 'cw-bottom-bar';
    bottomBar.innerHTML = `<svg width="15" height="15" viewBox="0 0 24 24" fill="white"><path d="M8 5v14l11-7z"/></svg><span>Épisode ${cw.episode}</span>`;
    poster.appendChild(bottomBar);

    const progress = document.createElement('div');
    progress.className = 'cw-progress';
    const fill = document.createElement('div');
    fill.className = 'cw-progress-fill';
    fill.style.width = Math.round(cw.fraction * 100) + '%';
    progress.appendChild(fill);
    poster.appendChild(progress);
  } else {
    // Bouton favori (marque-page) en haut à droite, TOUJOURS visible.
    const favBtn = document.createElement('button');
    favBtn.className = 'fav-btn';
    const fav = isFavorite(anime.id);
    favBtn.innerHTML = `<svg width="16" height="16" viewBox="0 0 24 24" fill="white">${fav ? BOOKMARK_FILLED : BOOKMARK_OUTLINE}</svg>`;
    favBtn.onclick = (e) => {
      e.stopPropagation();
      const now = toggleFavorite(anime.id);
      favBtn.innerHTML = `<svg width="16" height="16" viewBox="0 0 24 24" fill="white">${now ? BOOKMARK_FILLED : BOOKMARK_OUTLINE}</svg>`;
    };
    poster.appendChild(favBtn);
  }

  // Overlay au survol SEULEMENT : dégradé + "Infos" / "Ep 1" (ou
  // "Continuer" pour une carte "Continuer à regarder"), comme
  // _CardHoverActions côté Flutter.
  const hoverActions = document.createElement('div');
  hoverActions.className = 'card-hover-actions';
  const infoBtn = document.createElement('button');
  infoBtn.className = 'btn btn-secondary';
  infoBtn.textContent = 'ⓘ Infos';
  infoBtn.onclick = (e) => { e.stopPropagation(); openDetail(anime, card.querySelector('.card-poster')); };
  // Carte normale (pas dans "Continuer à regarder") mais dont l'anime a
  // déjà une progression enregistrée ailleurs (ex: on vient de regarder
  // l'épisode 5 puis on retombe sur sa carte dans une rangée genre) : on
  // reprend au bon épisode/moment au lieu de toujours repartir sur l'Ep 1.
  const existingProgress = cw ? null : watchProgress.get(anime.id);
  const playBtn = document.createElement('button');
  playBtn.className = 'btn btn-primary';
  playBtn.textContent = cw ? '▶ Continuer'
    : existingProgress ? `▶ Reprendre Ép. ${existingProgress.episode}`
    : '▶ Ep 1';
  playBtn.onclick = (e) => {
    e.stopPropagation();
    const epNumber = cw ? cw.episode : existingProgress ? existingProgress.episode : (anime.format === 'MOVIE' ? 0 : 1);
    const resumeFraction = cw ? cw.fraction : existingProgress ? existingProgress.fraction : null;
    fetchServerVideos(anime.id).then((videos) => {
      detailCurrentVideos = videos;
      const entry = videos[epNumber];
      if (!entry || !entry.video) {
        toast("Cette vidéo n'est pas encore disponible.");
        openDetail(anime, card.querySelector('.card-poster'));
        return;
      }
      openPlayer(anime, epNumber, entry, resumeFraction);
    });
  };
  hoverActions.appendChild(infoBtn);
  hoverActions.appendChild(playBtn);
  // Enfant de poster (voir le commentaire sur .card-hover-actions en CSS :
  // sans risque maintenant que .card-poster ne zoome plus elle-même, seule
  // l'image à l'intérieur zoome).
  poster.appendChild(hoverActions);

  posterWrap.appendChild(poster);
  card.appendChild(posterWrap);

  const title = document.createElement('div');
  title.className = 'card-title';
  title.textContent = cw ? (cw.animeTitle || titleText) : titleText;
  // Infobulle native au survol : filet de sécurité si le titre est encore
  // trop long pour tenir sur les 2 lignes autorisées par .card-title.
  title.title = title.textContent;
  card.appendChild(title);

  if (!cw && anime.genres?.length) {
    const genresEl = document.createElement('div');
    genresEl.className = 'card-genres';
    genresEl.textContent = anime.genres.slice(0, 2).map(translateGenre).join(', ');
    card.appendChild(genresEl);
  }

  return card;
}

// Construit une rangée complète (_AnimeRow / _ContinueWatchingRow) : titre +
// liste horizontale scrollable + flèches gauche/droite qui n'apparaissent
// que quand il y a effectivement de quoi défiler dans cette direction
// (comme _ArrowScrollRow côté Flutter).
function renderRow(parent, title, cards, { continueWatchingClass } = {}) {
  if (cards.length === 0) return;

  const section = document.createElement('div');
  section.className = 'row-section' + (continueWatchingClass ? ' continue-watching' : '');

  const titleEl = document.createElement('div');
  titleEl.className = 'row-title';
  titleEl.textContent = title;
  section.appendChild(titleEl);

  const wrap = document.createElement('div');
  wrap.className = 'row-wrap';

  const scroll = document.createElement('div');
  scroll.className = 'row-scroll';
  cards.forEach((card) => scroll.appendChild(card));
  wrap.appendChild(scroll);

  const leftArrow = document.createElement('div');
  leftArrow.className = 'row-arrow left';
  leftArrow.innerHTML = '<button>&#8249;</button>';
  const rightArrow = document.createElement('div');
  rightArrow.className = 'row-arrow right';
  rightArrow.innerHTML = '<button>&#8250;</button>';
  wrap.appendChild(leftArrow);
  wrap.appendChild(rightArrow);

  const scrollStep = 250 * 2; // posterWidth * 2, comme _AnimeRow
  leftArrow.querySelector('button').onclick = () => scroll.scrollBy({ left: -scrollStep, behavior: 'smooth' });
  rightArrow.querySelector('button').onclick = () => scroll.scrollBy({ left: scrollStep, behavior: 'smooth' });

  function updateArrows() {
    const canLeft = scroll.scrollLeft > 4;
    const canRight = scroll.scrollLeft < scroll.scrollWidth - scroll.clientWidth - 4;
    leftArrow.classList.toggle('visible', canLeft);
    rightArrow.classList.toggle('visible', canRight);
  }
  scroll.addEventListener('scroll', updateArrows);
  window.addEventListener('resize', updateArrows);
  // Après le premier layout (comme addPostFrameCallback côté Flutter) :
  // scrollWidth/clientWidth ne sont fiables qu'une fois les images mesurées.
  requestAnimationFrame(updateArrows);

  section.appendChild(wrap);
  parent.appendChild(section);
}
