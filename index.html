<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="ryuk">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>ryuk</title>
  <link rel="manifest" href="manifest.json">
  <style>
    /* Évite un flash blanc (fond par défaut de la page) pendant les
       changements de mise en page comme le passage en plein écran, le
       temps que Flutter redessine son propre fond noir. */
    html, body {
      background-color: #000000;
    }
  </style>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>

  <!--
    Rendu ASS fidèle pour les sous-titres (police/couleurs/position d'origine
    préservées) via JASSUB, accroché directement à l'élément <video> créé par
    le lecteur (voir video_player_screen.dart, _attachAssSubtitlesIfNeeded).

    Contrairement à une tentative précédente, JASSUB n'est PAS chargé depuis
    un CDN à l'exécution : la librairie (et ses propres dépendances internes,
    comme "abslink") est regroupée à l'avance en un seul fichier autonome
    (voir web/jassub/, généré via esbuild) et hébergée directement avec le
    site. Charger les morceaux séparément depuis un CDN provoquait une
    erreur interne à la librairie (les navigateurs bloquent aussi la
    création d'un Worker distant, ce qui forçait des contournements fragiles
    en plus). Le fichier autonome évite tout ça.
    Si ce script ne charge pas, l'app retombe automatiquement sur son ancien
    overlay texte — rien ne casse.
  -->
  <script type="module">
    import JASSUB from './jassub/jassub.js';

    window.attachJassub = function (videoEl, assContent) {
      try {
        return new JASSUB({
          video: videoEl,
          subContent: assContent,
          // Chemins ABSOLUS (avec "/" au début) : le fichier .wasm est en
          // fait chargé depuis l'intérieur du Worker, où un chemin relatif
          // se résout par rapport à la position du Worker
          // (/jassub/worker/worker.js) et non par rapport à la page — un
          // chemin relatif donnait donc une mauvaise URL (404). Un chemin
          // absolu se résout pareil dans les deux cas.
          workerUrl: '/jassub/worker/worker.js',
          wasmUrl: '/jassub/wasm/jassub-worker.wasm',
          modernWasmUrl: '/jassub/wasm/jassub-worker-modern.wasm',
          // Désactive la résolution des polices via le système local
          // (Local Font Access API) : pas nécessaire ici — JASSUB embarque
          // déjà une police par défaut (jassub/default.woff2) utilisée pour
          // tout texte dont la police n'est pas fournie explicitement.
          queryFonts: false,
        });
      } catch (e) {
        console.error('JASSUB : accroche échouée, repli sur l\'overlay texte.', e);
        return null;
      }
    };

    window.detachJassub = function (instance) {
      if (instance && typeof instance.destroy === 'function') {
        instance.destroy().catch(() => {});
      }
    };
  </script>
</body>
</html>
