// Rangée "Continuer à regarder" — VRAI suivi de progression. Persisté dans
// localStorage (pas juste en mémoire comme avant) : une entrée doit rester
// TANT QUE l'utilisateur n'a pas cliqué sur la croix pour la retirer, y
// compris après un F5 ou la fermeture de l'onglet — voir
// saveWatchProgressToStorage/loadWatchProgressFromStorage. Une entrée
// n'apparaît QUE si la lecture a vraiment démarré (événement 'play' de la
// vidéo, même une seconde), jamais juste parce qu'on a ouvert l'écran de
// lecture — voir registerWatchProgress().
const watchProgress = new Map(); // animeId -> { anime, episode, fraction, updatedAt }
const WATCH_PROGRESS_LS_KEY = 'adn_watch_progress';

function saveWatchProgressToStorage() {
  try {
    const rows = Array.from(watchProgress.values()).map((e) => ({
      animeId: e.anime.id,
      episode: e.episode,
      fraction: e.fraction,
      updatedAt: e.updatedAt,
    }));
    localStorage.setItem(WATCH_PROGRESS_LS_KEY, JSON.stringify(rows));
  } catch {
    // Stockage indisponible (navigation privée, quota...) : tant pis, la
    // progression ne survivra juste pas à un F5.
  }
}

// Ne stocke QUE animeId/episode/fraction (pas l'objet anime complet, déjà
// mis en cache ailleurs par fetchAnimeMeta/readAnimeMetaFromStorage) : on le
// retrouve ici d'abord en mémoire, puis en repli dans son propre cache
// localStorage (encore valide même après un F5, contrairement au cache
// mémoire) ; s'il n'est nulle part (cache expiré), on va le rechercher sur
// le réseau sans bloquer l'affichage, et on réaffiche une fois arrivé.
function loadWatchProgressFromStorage() {
  let rows;
  try {
    rows = JSON.parse(localStorage.getItem(WATCH_PROGRESS_LS_KEY) || '[]');
  } catch {
    rows = [];
  }
  if (!Array.isArray(rows)) return;
  const missingIds = [];
  for (const row of rows) {
    if (!row || row.animeId == null) continue;
    const anime = animeMetaCache.get(row.animeId) || readAnimeMetaFromStorage(row.animeId);
    if (anime) {
      watchProgress.set(row.animeId, {
        anime,
        episode: row.episode,
        fraction: row.fraction,
        updatedAt: row.updatedAt,
      });
    } else {
      missingIds.push(row);
    }
  }
  if (missingIds.length) {
    Promise.all(missingIds.map((row) => fetchAnimeMeta(row.animeId).then((anime) => {
      if (!anime) return;
      watchProgress.set(row.animeId, {
        anime,
        episode: row.episode,
        fraction: row.fraction,
        updatedAt: row.updatedAt,
      });
    }))).then(() => {
      if (allAnimes.length) renderAllRows(allAnimes);
    });
  }
}

// L'écriture localStorage est synchrone (bloquante) : on ne la fait pas à
// chaque 'timeupdate' (toutes les ~250ms pendant la lecture), seulement au
// plus une fois toutes les 3s (+ immédiatement sur les moments qui comptent :
// premier 'play', pause, fermeture/rechargement de l'onglet, croix de
// suppression) — la mémoire (watchProgress) reste, elle, toujours à jour.
let _watchProgressSaveTimer = null;
function scheduleSaveWatchProgress() {
  if (_watchProgressSaveTimer) return;
  _watchProgressSaveTimer = setTimeout(() => {
    _watchProgressSaveTimer = null;
    saveWatchProgressToStorage();
  }, 3000);
}
window.addEventListener('beforeunload', saveWatchProgressToStorage);

// Historique des épisodes TERMINÉS (badge "Vu" façon Crunchyroll sur la
// grille de la fiche détail) — SÉPARÉ de watchProgress ci-dessus, qui ne
// retient qu'UN SEUL épisode par animé (le dernier regardé, pour "Continuer
// à regarder"). Ici on garde TOUS les épisodes déjà terminés d'un coup
// (ex: épisode 3 affiché "Vu" alors que l'épisode 4 est en cours), de façon
// permanente une fois le seuil franchi (revoir un bout d'un épisode déjà vu
// ne doit pas lui retirer son "Vu").
const watchedEpisodes = new Map(); // animeId -> Set<epNumber>
const WATCHED_EPISODES_LS_KEY = 'adn_watched_episodes';

function isEpisodeWatched(animeId, epNumber) {
  return !!watchedEpisodes.get(animeId)?.has(epNumber);
}

function saveWatchedEpisodesToStorage() {
  try {
    const obj = {};
    for (const [animeId, set] of watchedEpisodes) obj[animeId] = Array.from(set);
    localStorage.setItem(WATCHED_EPISODES_LS_KEY, JSON.stringify(obj));
  } catch {
    // Stockage indisponible : tant pis, l'historique "Vu" ne survivra juste
    // pas à un F5.
  }
}

function loadWatchedEpisodesFromStorage() {
  let obj;
  try {
    obj = JSON.parse(localStorage.getItem(WATCHED_EPISODES_LS_KEY) || '{}');
  } catch {
    obj = {};
  }
  if (!obj || typeof obj !== 'object') return;
  for (const key of Object.keys(obj)) {
    const animeId = Number(key);
    if (Number.isNaN(animeId) || !Array.isArray(obj[key])) continue;
    watchedEpisodes.set(animeId, new Set(obj[key]));
  }
}
// Ne dépend d'aucun catalogue/cache réseau (juste animeId/numéro) : chargé
// tout de suite, pas besoin d'attendre init() comme pour watchProgress.
loadWatchedEpisodesFromStorage();

// Progression PAR ÉPISODE (indépendant de watchProgress, qui ne retient
// qu'UN seul épisode "en cours" par animé pour "Continuer à regarder") —
// permet à ep17 ET ep18 d'afficher chacun leur propre barre de progression
// dans la grille de la fiche détail, même après avoir regardé ep18 en
// dernier (watchProgress écraserait sinon la progression d'ep17).
const episodeProgress = new Map(); // animeId -> Map<epNumber, fraction>
const EPISODE_PROGRESS_LS_KEY = 'adn_episode_progress';

function getEpisodeProgressFraction(animeId, epNumber) {
  return episodeProgress.get(animeId)?.get(epNumber) ?? null;
}
function setEpisodeProgress(animeId, epNumber, fraction) {
  let m = episodeProgress.get(animeId);
  if (!m) { m = new Map(); episodeProgress.set(animeId, m); }
  m.set(epNumber, fraction);
}
function saveEpisodeProgressToStorage() {
  try {
    const obj = {};
    for (const [animeId, m] of episodeProgress) obj[animeId] = Object.fromEntries(m);
    localStorage.setItem(EPISODE_PROGRESS_LS_KEY, JSON.stringify(obj));
  } catch {
    // Stockage indisponible : tant pis, les barres de progression par
    // épisode ne survivront juste pas à un F5.
  }
}
let _episodeProgressSaveTimer = null;
function scheduleSaveEpisodeProgress() {
  if (_episodeProgressSaveTimer) return;
  _episodeProgressSaveTimer = setTimeout(() => {
    _episodeProgressSaveTimer = null;
    saveEpisodeProgressToStorage();
  }, 3000);
}
function loadEpisodeProgressFromStorage() {
  let obj;
  try {
    obj = JSON.parse(localStorage.getItem(EPISODE_PROGRESS_LS_KEY) || '{}');
  } catch {
    obj = {};
  }
  if (!obj || typeof obj !== 'object') return;
  for (const key of Object.keys(obj)) {
    const animeId = Number(key);
    if (Number.isNaN(animeId) || !obj[key] || typeof obj[key] !== 'object') continue;
    const m = new Map();
    for (const epKey of Object.keys(obj[key])) {
      const ep = Number(epKey);
      const frac = Number(obj[key][epKey]);
      if (!Number.isNaN(ep) && !Number.isNaN(frac)) m.set(ep, frac);
    }
    episodeProgress.set(animeId, m);
  }
}
// Ne dépend d'aucun catalogue/cache réseau : chargé tout de suite, comme
// watchedEpisodes ci-dessus.
loadEpisodeProgressFromStorage();
window.addEventListener('beforeunload', saveEpisodeProgressToStorage);

function markEpisodeWatched(animeId, epNumber) {
  let set = watchedEpisodes.get(animeId);
  if (!set) {
    set = new Set();
    watchedEpisodes.set(animeId, set);
  }
  if (set.has(epNumber)) return; // déjà marqué, rien à persister en plus
  set.add(epNumber);
  saveWatchedEpisodesToStorage();
}

function registerWatchProgress(anime, epNumber, fraction, { immediate } = {}) {
  if (!anime || anime.format === 'MOVIE') return;
  const clamped = Math.max(0, Math.min(1, fraction || 0));
  watchProgress.set(anime.id, {
    anime,
    episode: epNumber,
    fraction: clamped,
    updatedAt: Date.now(),
  });
  if (clamped >= 0.95) {
    markEpisodeWatched(anime.id, epNumber);
  } else {
    setEpisodeProgress(anime.id, epNumber, clamped);
    if (immediate) saveEpisodeProgressToStorage();
    else scheduleSaveEpisodeProgress();
  }
  if (immediate) saveWatchProgressToStorage();
  else scheduleSaveWatchProgress();
}
function getContinueWatchingList() {
  return Array.from(watchProgress.values())
    .filter((e) => e.fraction < 0.95) // épisode terminé -> retiré de la rangée
    .sort((a, b) => b.updatedAt - a.updatedAt);
}

// Reprise automatique sur CET épisode précis (pas juste "le dernier regardé"
// comme getContinueWatchingList) — utilisé partout où on peut lancer un
// épisode qui n'est pas forcément le tout dernier ouvert : bouton "épisode
// suivant/précédent" du lecteur, menu de changement rapide d'épisode, grille
// d'épisodes de la fiche détail. Sans ça, rouvrir un épisode déjà commencé à
// 18 min par un de ces chemins repartait à 0 (retour utilisateur).
function resumeFractionForEpisode(animeId, epNumber) {
  // Un épisode déjà marqué "Vu" repart de 0 si on le relance (comportement
  // attendu en re-regardant un épisode terminé), plutôt que de rester
  // bloqué à ~100%.
  if (isEpisodeWatched(animeId, epNumber)) return null;
  // Source principale : la progression PAR épisode (celle qui alimente
  // aussi la barre "Xm restantes" affichée sur la vignette) — sans ça, un
  // épisode affiché "13m restantes" repartait quand même de 0 au clic, car
  // seul watchProgress (un seul épisode "en cours" par animé) était
  // consulté ici (retour utilisateur).
  const epFraction = getEpisodeProgressFraction(animeId, epNumber);
  if (epFraction != null) return epFraction;
  const wp = watchProgress.get(animeId);
  return (wp && wp.episode === epNumber) ? wp.fraction : null;
}

function renderAllRows(animesRaw) {
  const container = document.getElementById('rowsContainer');
  container.innerHTML = '';

  // Une seule carte par franchise sur l'accueil aussi (avant, "Solo
  // Leveling" et "Solo Leveling Season 2" apparaissaient tous les deux) —
  // les autres saisons restent accessibles via les badges sur la fiche
  // détail, exactement comme pour la recherche.
  const animes = dedupeFranchises(animesRaw);

  const cwList = getContinueWatchingList();
  if (cwList.length > 0) {
    const cwCards = cwList.map((entry) => createCardElement(entry.anime, {
      continueWatching: {
        episode: entry.episode,
        fraction: entry.fraction,
        animeTitle: entry.anime.title?.english || entry.anime.title?.romaji,
      },
      onRemove: () => {
        watchProgress.delete(entry.anime.id);
        saveWatchProgressToStorage();
        renderAllRows(allAnimes);
      },
    }));
    renderRow(container, 'Continuer à regarder', cwCards, { continueWatchingClass: true });
  }

  // Classement par vraie popularité (note moyenne AniList — la seule
  // donnée de popularité qu'on reçoit réellement du catalogue, il n'y a
  // pas de tendances "France en temps réel" trackées par ce prototype),
  // au lieu de l'ordre d'ajout au serveur (= dernier épisode posté en
  // premier), qui n'a aucun rapport avec ce qui est vraiment populaire.
  const byScoreDesc = (list) => list.slice().sort((a, b) => (b.averageScore ?? -1) - (a.averageScore ?? -1));

  const tendanceCards = byScoreDesc(animes).map((a, idx) => createCardElement(a, { delay: idx * 25 }));
  renderRow(container, 'Tendance en France', tendanceCards);

  // Rangées par genre — mêmes règles que _buildGenreRows côté Flutter : les
  // 4 genres les plus représentés, à condition d'avoir au moins 4 animés.
  const counts = {};
  animes.forEach((a) => (a.genres || []).forEach((g) => (counts[g] = (counts[g] || 0) + 1)));
  const topGenres = Object.entries(counts)
    .filter(([, count]) => count >= 4)
    .sort((a, b) => b[1] - a[1])
    .slice(0, 4)
    .map(([g]) => g);
  topGenres.forEach((genre) => {
    const matching = byScoreDesc(animes.filter((a) => (a.genres || []).includes(genre)));
    const cards = matching.map((a, idx) => createCardElement(a, { delay: idx * 25 }));
    renderRow(container, translateGenre(genre), cards);
  });

  if (animes.length === 0 && cwList.length === 0) {
    container.innerHTML = '<div class="empty-msg">Aucun animé trouvé.</div>';
  }
}

function renderSearchGrid(animes) {
  const grid = document.getElementById('searchGrid');
  grid.innerHTML = '';
  if (animes.length === 0) {
    grid.innerHTML = '<div class="empty-msg">Aucun animé trouvé.</div>';
    return;
  }
  animes.forEach((a, idx) => grid.appendChild(createCardElement(a, { delay: idx * 25 })));
}

// ---------- Fiche détail (DetailScreen) ----------

let detailSelectedLanguage = 'vostfr';
let detailCurrentAnime = null;
let detailCurrentVideos = {};

function goHome() {
  if (document.getElementById('detailView').classList.contains('view-visible')) {
    closeDetail();
  } else {
    location.reload();
  }
}

// Ouvre la fiche détail directement, sans animation de transition (l'ancien
// zoom depuis la jaquette + fondu croisé causait un flash de mauvaise
// bannière quand le carrousel d'accueil tournait pendant l'animation —
// plus simple et plus fiable de juste basculer les deux vues d'un coup).
async function openDetail(anime, originEl) {
  if (!anime) return;
  detailCurrentAnime = anime;
  detailSelectedLanguage = 'vostfr';
  clearInterval(heroTimer);

  // Logo de la bannière : la fiche s'ouvre TOUT DE SUITE, sans l'attendre
  // (comme la bannière/le bandeau d'accueil) — si on ne l'a pas déjà
  // (ex: carte cliquée depuis une rangée, qui n'en a jamais demandé un),
  // buildDetailView affiche le titre en texte puis le remplace proprement
  // par le logo dès qu'il est prêt (voir son repli "else" plus bas), jamais
  // par bouts grâce au préchargement.
  const homeView = document.getElementById('homeView');
  const detailView = document.getElementById('detailView');
  const backBtn = document.getElementById('backBtn');

  buildDetailView(anime);

  homeView.style.display = 'none';
  backBtn.style.display = '';
  detailView.style.display = 'block';
  detailView.classList.add('view-visible');
  window.scrollTo(0, 0);

  pushHistoryState('#/anime/' + anime.id, { view: 'detail', animeId: anime.id });
}

function closeDetail() {
  const homeView = document.getElementById('homeView');
  const detailView = document.getElementById('detailView');
  const backBtn = document.getElementById('backBtn');
  const wasVisible = detailView.classList.contains('view-visible');

  detailView.classList.remove('view-visible');
  detailView.style.display = 'none';
  backBtn.style.display = 'none';
  homeView.style.display = '';
  window.scrollTo(0, 0);
  restartHeroAutoplay();

  if (wasVisible) pushHistoryState('#/', { view: 'home' });
}

function buildDetailView(anime) {
  const titleText = anime.title?.english || anime.title?.romaji || '';
  document.title = titleText ? `${titleText} — AnimeDodo` : 'AnimeDodo';

  // Titre toujours affiché en texte sous la bannière (en plus du logo/texte
  // en surimpression sur la bannière elle-même) — demandé explicitement.
  document.getElementById('detailTitleBelow').textContent = titleText;

  // Bannière + logo/texte de titre (mêmes tailles que DetailScreen : logo
  // 560x170 max, texte 34px, contenu ancré bottom:28 au lieu de bottom:52
  // sur la bannière d'accueil).
  const bannerImg = document.getElementById('detailBannerImg');
  bannerImg.src = anime.bannerImage || anime.coverImage?.extraLarge || '';
  const content = document.getElementById('detailBannerContent');
  content.innerHTML = '';
  if (anime._logoUrl) {
    // Préchargé (voir loadLogoImg) : jamais un <img> avec juste `src`
    // posé, qui s'afficherait par bouts au fur et à mesure du
    // téléchargement avant d'être complet.
    loadLogoImg(anime._logoUrl, 'detail-logo-img', titleText, (img) => {
      if (detailCurrentAnime === anime) {
        content.innerHTML = '';
        content.appendChild(img);
      }
    });
  } else {
    // Pas de logo (encore) connu : on laisse la bannière sans texte de
    // titre en surimpression, plutôt que d'y remettre le même texte que
    // celui déjà affiché juste en dessous (detailTitleBelow) — ça faisait
    // apparaître le titre deux fois d'affilée dès qu'aucun logo n'existe
    // pour l'animé (retour utilisateur : "pourquoi ya 2 fois le titre").
    // Va chercher le logo en arrière-plan si on ne l'a pas déjà (ex : fiche
    // ouverte depuis une carte de rangée, qui n'en a jamais demandé un) — si
    // un logo arrive, il vient remplacer ce vide.
    fetchTitleLogo(anime).then((logoUrl) => {
      if (!logoUrl || detailCurrentAnime !== anime) return;
      anime._logoUrl = logoUrl;
      loadLogoImg(logoUrl, 'detail-logo-img', titleText, (img) => {
        if (detailCurrentAnime === anime) {
          content.innerHTML = '';
          content.appendChild(img);
        }
      });
    });
  }

  // Puces (score, épisodes, favori) — voir infoContent côté Flutter.
  const chips = document.getElementById('detailChips');
  chips.innerHTML = '';
  if (typeof anime.averageScore === 'number') {
    const scoreChip = document.createElement('div');
    scoreChip.className = 'chip chip-star';
    scoreChip.innerHTML = `<svg width="18" height="18" viewBox="0 0 24 24" fill="#ffc107"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87L18.18 21 12 17.77 5.82 21 7 14.14l-5-4.87 6.91-1.01L12 2z"/></svg><span>${(anime.averageScore / 10).toFixed(1)}</span>`;
    chips.appendChild(scoreChip);
  }
  const epChip = document.createElement('div');
  epChip.className = 'chip chip-tv';
  epChip.innerHTML = `<svg width="18" height="18" viewBox="0 0 24 24" fill="#64ffda"><path d="M21 3H3c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h5v2h8v-2h5c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 14H3V5h18v12z"/></svg><span id="detailEpChipLabel">${anime.episodes ? anime.episodes + ' épisodes' : '… épisodes'}</span>`;
  chips.appendChild(epChip);

  const favBtn = document.createElement('button');
  favBtn.className = 'detail-fav-btn';
  const fav = isFavorite(anime.id);
  favBtn.innerHTML = `<svg width="24" height="24" viewBox="0 0 24 24" fill="white">${fav ? BOOKMARK_FILLED : BOOKMARK_OUTLINE}</svg>`;
  favBtn.onclick = () => {
    const now = toggleFavorite(anime.id);
    favBtn.innerHTML = `<svg width="24" height="24" viewBox="0 0 24 24" fill="white">${now ? BOOKMARK_FILLED : BOOKMARK_OUTLINE}</svg>`;
  };
  chips.appendChild(favBtn);

  // Badges "Saison 1 / Saison 2 / Film…" — d'abord une estimation instantanée
  // basée sur le titre (getFranchiseMembers), puis, dès que possible, une
  // version plus fiable basée sur le vrai graphe de relations AniList
  // (fetchFranchiseChain) — nécessaire pour les franchises dont les parties
  // n'ont pas de nom en commun (ex: JoJo's Bizarre Adventure / STEEL BALL RUN).
  const heuristicMembers = getFranchiseMembers(anime, allAnimes).map((m) => m.anime);
  renderFranchiseBadges(anime, heuristicMembers);

  fetchFranchiseChain(anime, allAnimes).then((chain) => {
    // On n'applique la version "relations" que si elle est au moins aussi
    // complète que l'heuristique par titre (sinon on garde ce qui est déjà
    // affiché, pour éviter un flicker/downgrade en cas d'échec réseau ou de
    // relations manquantes côté AniList) et seulement si l'utilisateur est
    // toujours sur cette fiche. Toujours utile même à nombre égal : la
    // numérotation "Saison N" de la version relations est calculée sur la
    // franchise complète (voir fetchFranchiseChain), donc correcte même si
    // les premières saisons ne sont pas encore postées — contrairement à
    // l'heuristique par titre qui ne peut que compter ce qui est posté.
    if (detailCurrentAnime?.id !== anime.id) return;
    if (chain.posted.length >= heuristicMembers.length) {
      renderFranchiseBadges(anime, chain);
    }
  });

  // Synopsis — affiché d'abord en anglais brut (immédiat), puis remplacé en
  // silence par la version française dès qu'elle arrive (même principe que
  // le FutureBuilder + AnimatedSwitcher de AnimeService.fetchFrenchSynopsis
  // côté Flutter).
  const synopsisEl = document.getElementById('detailSynopsis');
  synopsisEl.textContent = _cleanDescription(anime.description);
  fetchFrenchSynopsis(anime).then((text) => {
    if (detailCurrentAnime === anime) synopsisEl.textContent = text;
  });

  // Épisodes — chargés séparément (voir _loadServerVideos côté Flutter),
  // sans bloquer l'affichage du reste de la fiche.
  document.getElementById('episodeGrid').innerHTML = '';
  document.getElementById('detailLanguageToggle').innerHTML = '';
  document.getElementById('detailEpisodesLoading').style.display = 'block';

  fetchServerVideos(anime.id).then((videos) => {
    if (detailCurrentAnime !== anime) return; // l'utilisateur a changé de fiche entre-temps
    document.getElementById('detailEpisodesLoading').style.display = 'none';
    renderEpisodeSection(anime, videos);
  });
}

function renderEpisodeSection(anime, videos) {
  detailCurrentVideos = videos;
  const postedNumbers = Object.keys(videos).map(Number).filter((n) => !Number.isNaN(n) && n > 0).sort((a, b) => a - b);
  const epChipLabel = document.getElementById('detailEpChipLabel');
  const isMovie = anime.format === 'MOVIE';

  const hasLanguageChoice = Object.values(videos).some((v) => v?.languages && Object.keys(v.languages).length > 1);
  const hasAnyVideo = Object.keys(videos).length > 0;
  const langToggleEl = document.getElementById('detailLanguageToggle');
  langToggleEl.innerHTML = '';
  if (hasLanguageChoice) {
    const wrap = document.createElement('div');
    wrap.className = 'lang-toggle';
    ['vostfr', 'vf'].forEach((lang) => {
      const b = document.createElement('button');
      b.className = lang + (detailSelectedLanguage === lang ? ' active ' + lang : '');
      b.textContent = lang.toUpperCase();
      b.onclick = () => {
        detailSelectedLanguage = lang;
        renderEpisodeSection(anime, videos);
      };
      wrap.appendChild(b);
    });
    langToggleEl.appendChild(wrap);
  } else if (hasAnyVideo) {
    const badge = document.createElement('span');
    badge.className = 'lang-badge-fixed';
    badge.textContent = 'VOSTFR';
    langToggleEl.appendChild(badge);
  }

  const grid = document.getElementById('episodeGrid');
  grid.innerHTML = '';

  if (isMovie) {
    const key = videos[0] ? 0 : (postedNumbers[0] ?? 0);
    const entry = videos[key];
    if (epChipLabel) epChipLabel.textContent = entry ? 'Film' : 'Film';
    grid.appendChild(buildEpisodeCard(anime, key, entry, entry ? 'Lecture vidéo' : 'Vidéo pas encore disponible'));
    return;
  }

  const totalEpisodes = anime.episodes || postedNumbers[postedNumbers.length - 1] || postedNumbers.length;
  if (epChipLabel) {
    epChipLabel.textContent = anime.episodes
      ? anime.episodes + ' épisodes'
      : (postedNumbers.length ? postedNumbers.length + ' épisodes en ligne' : '? épisodes');
  }

  if (!totalEpisodes) {
    grid.innerHTML = '<div class="detail-loading">Aucun épisode disponible pour le moment.</div>';
    return;
  }

  const numbers = anime.episodes ? Array.from({ length: anime.episodes }, (_, i) => i + 1) : postedNumbers;
  // Sécurité anti-gel façon _episodesPerPage côté Flutter : au-delà de 200
  // épisodes on ne construit que les 200 premiers dans ce prototype.
  const capped = numbers.slice(0, 200);
  capped.forEach((num) => {
    grid.appendChild(buildEpisodeCard(anime, num, videos[num], null));
  });
  applyEpisodeTitlesAsync(anime, grid);
}

function buildEpisodeCard(anime, number, entry, overrideLabel) {
  const card = document.createElement('div');
  card.className = 'ep-card' + (entry ? '' : ' no-video');

  const thumbWrap = document.createElement('div');
  thumbWrap.className = 'ep-thumb-wrap' + (entry ? '' : ' no-video');

  if (!entry) {
    thumbWrap.innerHTML = `<div class="ep-placeholder"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Bientôt disponible</div>`;
  } else if (entry.thumbnail) {
    const img = document.createElement('img');
    img.loading = 'lazy';
    // Le serveur renvoie un CHEMIN RELATIF (ex: "/api/thumbnail/123/1"), pas
    // une URL complète — voir thumbnailUrl côté Flutter qui préfixe avec
    // kApiBaseUrl. Sans ça, le navigateur essayait de résoudre ce chemin par
    // rapport au fichier local lui-même, d'où les vignettes qui ne
    // s'affichaient jamais dans ce prototype.
    img.src = entry.thumbnail.startsWith('http') ? entry.thumbnail : API_BASE + entry.thumbnail;
    // Repli identique à errorBuilder côté Flutter si la vignette ne charge
    // pas (générée à la volée côté serveur, peut occasionnellement échouer).
    img.onerror = () => {
      thumbWrap.classList.add('no-thumb');
      thumbWrap.innerHTML = '<svg width="34" height="34" viewBox="0 0 24 24" fill="#64ffda"><path d="M8 5v14l11-7z"/></svg>';
    };
    thumbWrap.appendChild(img);

    // Progression façon Crunchyroll : "Vu" (vignette assombrie + icône de
    // relecture) pour TOUT épisode déjà terminé un jour (isEpisodeWatched,
    // historique permanent — plusieurs épisodes peuvent être "Vu" en même
    // temps), barre + "X min restantes" pour CHAQUE épisode entamé
    // (episodeProgress, par épisode — ep17 à 10 min ET ep18 à 10 min
    // affichent chacun leur propre barre, même si ep18 a été regardé en
    // dernier).
    const isWatched = isEpisodeWatched(anime.id, number);
    const epFraction = !isWatched ? getEpisodeProgressFraction(anime.id, number) : null;
    const isInProgress = epFraction != null && epFraction > 0;
    if (isWatched) thumbWrap.classList.add('ep-watched');

    const playIcon = document.createElement('div');
    playIcon.className = 'ep-play-icon';
    playIcon.innerHTML = isWatched
      ? '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><path d="M3 12a9 9 0 1 0 3-6.7"/><polyline points="3 4 3 9 8 9"/></svg>'
      : '<svg width="20" height="20" viewBox="0 0 24 24" fill="white"><path d="M8 5v14l11-7z"/></svg>';
    thumbWrap.appendChild(playIcon);

    if (isInProgress) {
      const track = document.createElement('div');
      track.className = 'ep-progress-track';
      const fill = document.createElement('div');
      fill.className = 'ep-progress-fill';
      fill.style.width = `${Math.max(2, Math.min(100, epFraction * 100))}%`;
      track.appendChild(fill);
      thumbWrap.appendChild(track);
    }

    if (isWatched || isInProgress) {
      const status = document.createElement('div');
      status.className = 'ep-status-badge';
      if (isWatched) {
        status.textContent = 'Vu';
      } else if (entry.duration) {
        const remainingMin = Math.max(1, Math.round((entry.duration * (1 - epFraction)) / 60));
        status.textContent = `${remainingMin}m restantes`;
      } else {
        status.textContent = 'En cours';
      }
      thumbWrap.appendChild(status);
    } else if (entry.duration) {
      const dur = document.createElement('div');
      dur.className = 'ep-badge';
      const mins = Math.round(entry.duration / 60);
      dur.textContent = mins < 60 ? `${mins}min` : `${Math.floor(mins / 60)}h${(mins % 60).toString().padStart(2, '0')}`;
      thumbWrap.appendChild(dur);
    }
    if (entry.preview) {
      const previewBtn = document.createElement('button');
      previewBtn.className = 'ep-preview-btn';
      previewBtn.innerHTML = '<svg width="10" height="10" viewBox="0 0 24 24" fill="white"><path d="M8 5v14l11-7z"/></svg>';
      previewBtn.onclick = (e) => { e.stopPropagation(); toast("Preview de l'épisode suivant non incluse dans ce prototype."); };
      thumbWrap.appendChild(previewBtn);
    }
  } else {
    thumbWrap.className += ' no-thumb';
    thumbWrap.innerHTML = '<svg width="34" height="34" viewBox="0 0 24 24" fill="#64ffda"><path d="M8 5v14l11-7z"/></svg>';
  }

  card.appendChild(thumbWrap);
  const label = document.createElement('div');
  label.className = 'ep-label';
  const entryTitle = overrideLabel ? null : _entryEpisodeTitle(entry);
  if (overrideLabel) {
    label.textContent = overrideLabel;
  } else if (entryTitle) {
    label.textContent = `Épisode ${number} : ${entryTitle}`;
  } else {
    // Pas de titre connu du serveur vidéo : on affiche le numéro tout de
    // suite, et applyEpisodeTitlesAsync (voir renderEpisodeSection) viendra
    // le remplacer si AniList en connaît un.
    label.textContent = `Épisode ${number}`;
    label.dataset.epTitleable = '1';
    label.dataset.epNumber = String(number);
  }
  card.appendChild(label);

  card.onclick = () => {
    if (!entry) return;
    openPlayer(anime, number, entry, resumeFractionForEpisode(anime.id, number));
  };

  return card;
}

function formatPlayerTime(seconds) {
  if (!isFinite(seconds) || seconds < 0) seconds = 0;
  const s = Math.floor(seconds);
  const h = Math.floor(s / 3600);
  const m = Math.floor((s % 3600) / 60);
  const sec = s % 60;
  const two = (n) => String(n).padStart(2, '0');
  return h > 0 ? `${h}:${two(m)}:${two(sec)}` : `${two(m)}:${two(sec)}`;
}

const LANGUAGE_DISPLAY_NAMES = {
  fr: 'Français',
  en: 'Anglais',
  ja: 'Japonais',
  de: 'Allemand',
  es: 'Espagnol',
  'es-la': 'Espagnol (LA)',

  tr: 'Turc',
  vi: 'Vietnamien',
  id: 'Indonésien',
  th: 'Thaï',
  hi: 'Hindi',
};

function languageDisplayName(key) {
  const k = (key || '').toLowerCase();
  return LANGUAGE_DISPLAY_NAMES[k] || null;
}

function languagePlayerLabel(key) {
  if (key === 'vostfr') return 'Japonais';
  if (key === 'vf') return 'Français';
  const m = /^audio(\d+)$/.exec(key || '');
  if (m) return `Audio ${m[1]}`;
  return languageDisplayName(key) || (key || '').toUpperCase();
}

function subtitleLanguageLabel(key) {
  return languageDisplayName(key) || (key || '').toUpperCase();
}

function populateAvMenu(anime, epNumber, entry) {
  const menu = document.getElementById('playerAvMenu');
  const audioCol = document.getElementById('pavAudioCol');
  const subsCol = document.getElementById('pavSubsCol');
  const divider = document.getElementById('pavDivider');
  const audioRows = document.getElementById('pavAudioRows');
  const subsRows = document.getElementById('pavSubsRows');
  const btn = document.getElementById('pcAudioSubs');

  const languages = entry.languages || null;
  const hasAudioColumn = !!(languages && Object.keys(languages).length);
  // Multi-langues (nouveau, si le serveur les expose un jour) : objet
  // { code: cheminFichier, ... }, ex. { fr: '...', en: '...', ru: '...' }.
  // Sinon on retombe sur l'ancien champ unique entry.subtitle (une seule
  // piste, en français par convention actuelle du serveur).
  const subtitleTracks = _subtitleTracksOf(entry);
  const subtitleKeys = Object.keys(subtitleTracks);
  const hasSubtitles = subtitleKeys.length > 0;

  audioCol.style.display = hasAudioColumn ? '' : 'none';
  subsCol.style.display = hasSubtitles ? '' : 'none';
  divider.style.display = hasAudioColumn && hasSubtitles ? '' : 'none';
  btn.style.display = hasAudioColumn || hasSubtitles ? '' : 'none';

  audioRows.innerHTML = '';
  if (hasAudioColumn) {
    const effectiveLang = languages[detailSelectedLanguage] ? detailSelectedLanguage : Object.keys(languages)[0];
    Object.keys(languages).forEach((key) => {
      audioRows.appendChild(buildAvRow(languagePlayerLabel(key), key === effectiveLang, () => {
        closeAvMenu();
  closeEpMenu();
        if (key !== effectiveLang) {
          detailSelectedLanguage = key;
          // Même épisode, juste un changement de langue : on reprend la
          // position EXACTE où on en était (currentTime en direct, plus
          // fiable ici que watchProgress qui peut avoir jusqu'à 3s de
          // retard) plutôt que de considérer ça comme un nouvel épisode.
          const video = document.getElementById('playerVideo');
          const liveFraction = video && video.duration ? video.currentTime / video.duration : null;
          openPlayer(anime, epNumber, entry, liveFraction ?? resumeFractionForEpisode(anime.id, epNumber));
        }
      }));
    });
  }

  subsRows.innerHTML = '';
  if (hasSubtitles) {
    // Français choisi par défaut quand dispo, sinon la première piste connue.
    if (!playerSelectedSubtitleLang || !subtitleTracks[playerSelectedSubtitleLang]) {
      playerSelectedSubtitleLang = subtitleTracks.fr ? 'fr' : subtitleKeys[0];
    }
    subsRows.appendChild(buildAvRow('Désactivés', !playerSubtitlesEnabled, () => {
      playerSubtitlesEnabled = false;
      applyPlayerSubtitleVisibility();
      closeAvMenu();
  closeEpMenu();
    }));
    subtitleKeys.forEach((key) => {
      const selected = playerSubtitlesEnabled && key === playerSelectedSubtitleLang;
      subsRows.appendChild(buildAvRow(subtitleLanguageLabel(key), selected, () => {
        closeAvMenu();
  closeEpMenu();
        const changed = key !== playerSelectedSubtitleLang;
        playerSelectedSubtitleLang = key;
        playerSubtitlesEnabled = true;
        if (changed) {
          loadPlayerSubtitle(entry);
        } else {
          applyPlayerSubtitleVisibility();
        }
      }));
    });
  }
}

// Normalise les sous-titres d'un épisode en { code: chemin }, quel que soit
// le champ utilisé par le serveur : nouveau champ multi-langues
// entry.subtitles, ou ancien champ unique entry.subtitle (toujours FR).
function _subtitleTracksOf(entry) {
  if (entry && entry.subtitles && typeof entry.subtitles === 'object') {
    const out = {};
    Object.keys(entry.subtitles).forEach((key) => {
      const val = entry.subtitles[key];
      if (val) out[key.toLowerCase()] = val;
    });
    if (Object.keys(out).length) return out;
  }
  if (entry && entry.subtitle) return { fr: entry.subtitle };
  return {};
}

// ---- Contrôles (attachés une seule fois, le markup est statique) ----

// Peint à la main le remplissage violet de la barre de progression jusqu'au
// curseur (voir SliderTheme.activeColor côté Flutter) : -webkit-appearance:
// none désactive le remplissage natif de accent-color, donc on recalcule un
// dégradé à chaque changement de valeur.
function updateSeekFill(seekEl) {
  if (!seekEl) return;
  const min = Number(seekEl.min) || 0;
  const max = Number(seekEl.max) || 1;
  const val = Number(seekEl.value) || 0;
  const pct = max > min ? Math.min(100, Math.max(0, ((val - min) / (max - min)) * 100)) : 0;
  seekEl.style.background = `linear-gradient(to right, var(--player-accent) 0%, var(--player-accent) ${pct}%, rgba(255,255,255,0.24) ${pct}%, rgba(255,255,255,0.24) 100%)`;
}

// Taille du texte des sous-titres (overlay de secours, hors SubtitlesOctopus)
// recalculée d'après la taille réelle du lecteur — copie exacte de la formule
// Flutter : fontSize = min(videoHeight*42/360, videoWidth*42/640).clamp(16,48),
// outlineWidth = (fontSize/16).clamp(1.5,3.0).
function updateSubtitleFontSize() {
  const video = document.getElementById('playerVideo');
  const subtitleEl = document.getElementById('playerSubtitle');
  if (!video || !subtitleEl) return;
  const rect = video.getBoundingClientRect();
  const w = rect.width || video.clientWidth;
  const h = rect.height || video.clientHeight;
  if (!w || !h) return;
  let fontSize = Math.min(h * (42 / 360), w * (42 / 640));
  fontSize = Math.max(16, Math.min(48, fontSize));
  const outline = Math.max(1.5, Math.min(3.0, fontSize / 16));
  subtitleEl.style.setProperty('--sub-font-size', fontSize.toFixed(2) + 'px');
  subtitleEl.style.setProperty('--sub-outline', outline.toFixed(2) + 'px');
}

// Volume/mute persistés dans localStorage — survit à un F5 ("si j'ai baissé
// et je reload ça reste baissé"). Même <video> réutilisé pour tous les
// épisodes (bindPlayerControlsOnce ne tourne qu'une fois par session), donc
// ça n'a besoin d'être appliqué qu'une seule fois, au tout premier épisode
// ouvert — y compris celui rouvert automatiquement par restoreFromHash
// après un reload.
const PLAYER_VOLUME_LS_KEY = 'adn_player_volume';
function loadPlayerVolumeFromStorage() {
  try {
    const raw = JSON.parse(localStorage.getItem(PLAYER_VOLUME_LS_KEY) || 'null');
    if (raw && typeof raw.volume === 'number') {
      return { volume: Math.max(0, Math.min(1, raw.volume)), muted: !!raw.muted };
    }
  } catch {
    // Repli sur les valeurs par défaut ci-dessous.
  }
  return { volume: 1, muted: false };
}
function savePlayerVolumeToStorage(volume, muted) {
  try {
    localStorage.setItem(PLAYER_VOLUME_LS_KEY, JSON.stringify({ volume, muted }));
  } catch {
    // Stockage indisponible : tant pis, le volume repartira à 100% la fois
    // suivante plutôt que de planter quoi que ce soit.
  }
}

function bindPlayerControlsOnce() {
  if (playerControlsBound) return;
  playerControlsBound = true;

  const view = document.getElementById('playerView');
  const body = document.getElementById('playerBody');
  const video = document.getElementById('playerVideo');
  const seek = document.getElementById('playerSeek');
  const startBtn = document.getElementById('playerStartBtn');
  const playBtn = document.getElementById('pcPlayPause');
  const playIcon = document.getElementById('pcPlayIcon');
  const rewindBtn = document.getElementById('pcRewind');
  const forwardBtn = document.getElementById('pcForward');
  const muteBtn = document.getElementById('pcMute');
  const volumeIcon = document.getElementById('pcVolumeIcon');
  const volumeSlider = document.getElementById('pcVolume');
  const timeEl = document.getElementById('pcTime');
  const avBtn = document.getElementById('pcAudioSubs');
  const avMenu = document.getElementById('playerAvMenu');
  const fullscreenBtn = document.getElementById('pcFullscreen');
  const reportBtn = document.getElementById('pcReport');

  // Applique le volume mémorisé (voir savePlayerVolumeToStorage plus bas)
  // AVANT la toute première lecture de cette session — ensuite video.volume
  // reste sur le même <video> d'un épisode à l'autre tout seul, pas besoin
  // de le refaire.
  {
    const storedVol = loadPlayerVolumeFromStorage();
    video.volume = storedVol.volume;
    video.muted = storedVol.muted;
    volumeSlider.value = String(storedVol.muted ? 0 : storedVol.volume);
  }

  function updatePlayPauseIcon() {
    playIcon.innerHTML = video.paused ? PLAYER_ICON_PLAY : PLAYER_ICON_PAUSE;
  }
  function togglePlayPause() {
    view.classList.add('started');
    if (video.paused) video.play().catch(() => {}); else video.pause();
  }
  function showControls() {
    view.classList.remove('controls-hidden');
    clearTimeout(playerHideTimer);
    clearIdlePause();
    if (!video.paused) {
      playerHideTimer = setTimeout(() => view.classList.add('controls-hidden'), 2000);
    } else if (view.classList.contains('started')) {
      scheduleIdlePause();
    }
  }
  // Écran "en pause depuis 10s" (idle-paused) : comme Netflix, toute
  // activité (souris, clic, touche) l'annule et relance le compte à
  // rebours ; seul un vrai arrêt de 10s sans bouger le déclenche.
  function clearIdlePause() {
    clearTimeout(playerIdlePauseTimer);
    view.classList.remove('idle-paused');
  }
  function scheduleIdlePause() {
    clearTimeout(playerIdlePauseTimer);
    playerIdlePauseTimer = setTimeout(showIdlePauseOverlay, 10000);
  }
  function showIdlePauseOverlay() {
    if (!video.paused || !playerCurrentAnime) return;
    const anime = playerCurrentAnime;
    const titleText = anime.title?.english || anime.title?.romaji || '';
    const isMovie = anime.format === 'MOVIE';
    document.getElementById('idleTitle').textContent = titleText;
    document.getElementById('idleEpisode').textContent = isMovie ? '' : `Épisode ${playerCurrentEpNumber}`;
    document.getElementById('idleSynopsis').textContent = _cleanDescription(anime.description || '');
    view.classList.add('idle-paused');
  }
  function updateVolumeIcon() {
    volumeIcon.innerHTML = (video.muted || video.volume === 0) ? PLAYER_ICON_MUTED : PLAYER_ICON_VOLUME;
  }
  // Un clic sur la vidéo, avant le tout premier lancement, démarre la
  // lecture (comme le gros bouton) au lieu de basculer play/pause — comme
  // _handleVideoTap côté Flutter.
  function handleBodyClick(e) {
    if (e.target.closest('.pc-btn, .player-seek, .pc-volume, .player-av-menu, .player-ep-menu')) return;
    if (!view.classList.contains('started')) { startPlayback(); return; }
    togglePlayPause();
    showControls();
  }
  function startPlayback() {
    view.classList.add('started');
    video.play().catch(() => {});
    showControls();
  }

  startBtn.onclick = startPlayback;
  playBtn.onclick = () => { togglePlayPause(); showControls(); };
  // Signalement d'un problème de lecture (pas un signalement "contenu"
  // comme sur Netflix) : pour l'instant ça se contente de confirmer à
  // l'utilisateur, mais ça pourra plus tard alimenter la même liste
  // d'épisodes morts que le scan admin côté serveur.
  reportBtn.onclick = (e) => {
    e.stopPropagation();
    toast('Signalement envoyé, merci ! On va vérifier cet épisode.');
  };
  body.addEventListener('click', handleBodyClick);
  // Un vrai double-clic (deux "click" natifs successifs, qui se sont déjà
  // annulés entre eux côté lecture/pause) bascule le plein écran — comme le
  // double-clic maison de l'ancien site, sans changer l'état de lecture.
  body.addEventListener('dblclick', (e) => {
    if (e.target.closest('.pc-btn, .player-seek, .pc-volume, .player-av-menu, .player-ep-menu')) return;
    toggleFullscreen();
  });

  video.addEventListener('play', () => {
    updatePlayPauseIcon(); showControls(); clearIdlePause();
    // C'est ICI, et seulement ici, qu'un épisode entre dans "Continuer à
    // regarder" — ouvrir l'écran de lecture sans appuyer sur play ne doit
    // rien enregistrer (demande explicite) ; un seul play, même d'une
    // seconde, suffit en revanche.
    if (playerCurrentAnime) {
      const fraction = video.duration ? video.currentTime / video.duration : 0;
      registerWatchProgress(playerCurrentAnime, playerCurrentEpNumber, fraction, { immediate: true });
    }
  });
  video.addEventListener('pause', () => {
    updatePlayPauseIcon(); showControls(); scheduleIdlePause();
    if (playerCurrentAnime && watchProgress.has(playerCurrentAnime.id)) saveWatchProgressToStorage();
  });
  video.addEventListener('waiting', () => view.classList.add('buffering'));
  video.addEventListener('playing', () => view.classList.remove('buffering'));
  video.addEventListener('canplay', () => view.classList.remove('buffering'));
  video.addEventListener('volumechange', () => {
    updateVolumeIcon();
    updateSeekFill(volumeSlider);
    savePlayerVolumeToStorage(video.volume, video.muted);
  });

  rewindBtn.onclick = () => { video.currentTime = Math.max(0, video.currentTime - 5); showControls(); };
  forwardBtn.onclick = () => { video.currentTime = Math.min(video.duration || Infinity, video.currentTime + 5); showControls(); };

  video.addEventListener('loadedmetadata', () => {
    seek.max = String(Math.max(1, Math.floor(video.duration || 0)));
    if (playerPendingResumeFraction != null && video.duration) {
      video.currentTime = playerPendingResumeFraction * video.duration;
      seek.value = String(Math.floor(video.currentTime));
    }
    playerPendingResumeFraction = null;
    timeEl.textContent = `${formatPlayerTime(video.currentTime)} / ${formatPlayerTime(video.duration)}`;
    updateSeekFill(seek);
    updateSubtitleFontSize();
    // La barre affiche maintenant directement la vraie position (ou 0:00
    // s'il n'y avait rien à reprendre) : plus besoin de la masquer.
    view.classList.remove('resuming');
  });
  video.addEventListener('timeupdate', () => {
    if (!playerIsSeeking) { seek.value = String(Math.floor(video.currentTime)); updateSeekFill(seek); }
    timeEl.textContent = `${formatPlayerTime(video.currentTime)} / ${formatPlayerTime(video.duration)}`;
    // Met juste à jour la fraction d'une entrée déjà enregistrée (par le
    // 'play' ci-dessus) — ne crée jamais d'entrée toute seule.
    if (playerCurrentAnime && video.duration && watchProgress.has(playerCurrentAnime.id)) {
      registerWatchProgress(playerCurrentAnime, playerCurrentEpNumber, video.currentTime / video.duration);
    }
  });
  seek.addEventListener('input', () => { playerIsSeeking = true; clearTimeout(playerHideTimer); updateSeekFill(seek); });
  seek.addEventListener('change', () => {
    video.currentTime = Number(seek.value);
    playerIsSeeking = false;
    updateSeekFill(seek);
    showControls();
  });

  // La taille des sous-titres dépend de la taille réelle du lecteur : on la
  // recalcule au redimensionnement de la fenêtre et au passage plein écran
  // (comme le fait implicitement le rebuild de LayoutBuilder côté Flutter),
  // plus un ResizeObserver sur la vidéo elle-même pour couvrir tous les cas.
  window.addEventListener('resize', updateSubtitleFontSize);
  document.addEventListener('fullscreenchange', updateSubtitleFontSize);
  if (window.ResizeObserver) {
    new ResizeObserver(updateSubtitleFontSize).observe(video);
  }

  muteBtn.onclick = () => {
    video.muted = !video.muted;
    volumeSlider.value = String(video.muted ? 0 : video.volume);
    updateSeekFill(volumeSlider);
    showControls();
  };
  volumeSlider.oninput = () => {
    video.volume = Number(volumeSlider.value);
    video.muted = video.volume === 0;
    updateSeekFill(volumeSlider);
    clearTimeout(playerHideTimer);
  };
  volumeSlider.addEventListener('change', showControls);
  updateSeekFill(volumeSlider);

  avBtn.onclick = (e) => {
    e.stopPropagation();
    closeEpMenu();
    if (avMenu.classList.contains('open')) closeAvMenu(); else openAvMenu();
  };
  const epListBtn = document.getElementById('pcEpisodeList');
  epListBtn.onclick = (e) => {
    e.stopPropagation();
    closeAvMenu();
    const epMenu = document.getElementById('playerEpMenu');
    if (epMenu.classList.contains('open')) closeEpMenu(); else openEpMenu();
  };
  document.addEventListener('click', (e) => {
    if (avMenu.classList.contains('open') && !e.target.closest('.player-av-menu, #pcAudioSubs')) {
      closeAvMenu();
  closeEpMenu();
    }
    const epMenu = document.getElementById('playerEpMenu');
    if (epMenu.classList.contains('open') && !e.target.closest('.player-ep-menu, #pcEpisodeList')) {
      closeEpMenu();
    }
  });

  function toggleFullscreen() {
    if (!document.fullscreenElement) view.requestFullscreen?.().catch(() => {});
    else document.exitFullscreen?.();
  }
  fullscreenBtn.onclick = () => { toggleFullscreen(); showControls(); };
  const fullscreenIcon = document.getElementById('pcFullscreenIcon');
  function updateFullscreenIcon() {
    if (!fullscreenIcon) return;
    fullscreenIcon.innerHTML = document.fullscreenElement ? PLAYER_ICON_FULLSCREEN_EXIT : PLAYER_ICON_FULLSCREEN_ENTER;
  }
  document.addEventListener('fullscreenchange', updateFullscreenIcon);
  updateFullscreenIcon();

  body.addEventListener('mousemove', showControls);
}

function openPlayer(anime, epNumber, entry, resumeFraction) {
  if (!entry || !entry.video) {
    toast("Cette vidéo n'est pas encore disponible.");
    return;
  }
  clearInterval(heroTimer);
  bindPlayerControlsOnce();

  const view = document.getElementById('playerView');
  const video = document.getElementById('playerVideo');
  const titleEl = document.getElementById('playerTitle');
  const subtitleEl = document.getElementById('playerSubtitle');
  const playIcon = document.getElementById('pcPlayIcon');
  const seek = document.getElementById('playerSeek');
  const timeEl = document.getElementById('pcTime');

  playerCurrentAnime = anime;
  playerCurrentEpNumber = epNumber;
  playerCurrentEntry = entry;

  // [DEBUG TEMPORAIRE] Affiche tous les champs bruts de cet épisode dans la
  // console — sert à identifier le vrai nom du champ "titre français intégré
  // au fichier", et s'il existe plusieurs pistes de sous-titres/audio dispo
  // pour cet épisode. À retirer une fois ces champs confirmés.
  console.log(`[episode-debug] Épisode ${epNumber} — champs entry :`, entry);

  detachAssSubtitles();
  if (playerCueUpdateHandler) { video.removeEventListener('timeupdate', playerCueUpdateHandler); playerCueUpdateHandler = null; }
  playerAssCues = null;
  subtitleEl.innerHTML = '';
  video.querySelectorAll('track').forEach((t) => t.remove());
  // Chaque épisode rouvre l'écran de lecture "à zéro" — le gros bouton
  // central revient tant qu'on n'a pas cliqué dessus, exactement comme
  // l'ancien site (une nouvelle instance de VideoPlayerScreen à chaque
  // épisode, jamais de lecture automatique).
  view.classList.remove('playing', 'buffering', 'controls-hidden', 'started', 'subtitles-off', 'idle-paused');
  clearTimeout(playerIdlePauseTimer);
  closeAvMenu();
  closeEpMenu();
  playIcon.innerHTML = PLAYER_ICON_PLAY;
  seek.value = '0';
  seek.max = '1000';
  updateSeekFill(seek);
  timeEl.textContent = '00:00 / 00:00';

  const titleText = anime.title?.english || anime.title?.romaji || '';
  const isMovie = anime.format === 'MOVIE';
  const entryEpTitle = _entryEpisodeTitle(entry);
  if (isMovie) {
    titleEl.textContent = titleText;
  } else if (entryEpTitle) {
    titleEl.textContent = `${titleText} • Épisode ${epNumber} : ${entryEpTitle}`;
  } else {
    titleEl.textContent = `${titleText} • Épisode ${epNumber}`;
    titleEl.dataset.epTitleable = '1';
    titleEl.dataset.epNumber = String(epNumber);
    titleEl.dataset.epBaseText = titleEl.textContent;
    fetchEpisodeTitlesFromAniList(anime).then((map) => {
      // Vérifie qu'on est toujours sur ce même épisode avant de mettre à
      // jour (l'utilisateur a pu changer d'épisode entre-temps).
      if (!map || titleEl.dataset.epNumber !== String(epNumber) || titleEl.dataset.epBaseText !== titleEl.textContent) return;
      const title = map.get(epNumber);
      if (title) titleEl.textContent = `${titleText} • Épisode ${epNumber} : ${title}`;
    });
  }

  const languages = entry.languages || null;
  const hasLangChoice = languages && Object.keys(languages).length > 0;
  const effectiveLang = hasLangChoice
    ? (languages[detailSelectedLanguage] ? detailSelectedLanguage : Object.keys(languages)[0])
    : null;

  const base = entry.video.startsWith('http') ? entry.video : API_BASE + entry.video;
  video.src = effectiveLang ? `${base}?lang=${effectiveLang}` : base;
  video.currentTime = 0;

  {
    const epHash = '#/anime/' + anime.id + '/ep/' + epNumber + (effectiveLang ? '/' + effectiveLang : '');
    pushHistoryState(epHash, { view: 'player', animeId: anime.id, epNumber, lang: effectiveLang });
  }
  // Reprise depuis "Continuer à regarder" : appliquée dès que la durée est
  // connue (loadedmetadata), pas ici — la vidéo n'a pas encore de durée à
  // ce stade donc currentTime = fraction*duration donnerait n'importe quoi.
  playerPendingResumeFraction = (resumeFraction != null && resumeFraction > 0 && resumeFraction < 0.95) ? resumeFraction : null;
  // Masque la barre de progression tant qu'on n'a pas pu calculer la vraie
  // position de reprise (voir loadedmetadata plus bas, qui retire cette
  // classe) — évite le flash "0:00 puis ça saute au bon endroit".
  view.classList.toggle('resuming', playerPendingResumeFraction != null);
  video.load();

  populateAvMenu(anime, epNumber, entry);

  // Pas de sous-titres pour la variante VF (doublage français) — comme côté
  // Flutter.
  const wantsSubtitle = effectiveLang !== 'vf';
  const subtitleTracks = _subtitleTracksOf(entry);
  if (wantsSubtitle && Object.keys(subtitleTracks).length) {
    loadPlayerSubtitle(entry);
  }

  // Épisode précédent/suivant — boutons dans la barre du bas (comme
  // onNextEpisode/onPreviousEpisode côté Flutter).
  const prevEntry = detailCurrentVideos[epNumber - 1];
  const nextEntry = detailCurrentVideos[epNumber + 1];
  const pcPrevBtn = document.getElementById('pcPrevEp');
  const pcNextBtn = document.getElementById('pcNextEp');
  const hasPrev = !isMovie && !!prevEntry;
  const hasNext = !isMovie && !!nextEntry;
  pcPrevBtn.style.display = hasPrev ? '' : 'none';
  pcNextBtn.style.display = hasNext ? '' : 'none';
  const goPrev = () => openPlayer(anime, epNumber - 1, prevEntry, resumeFractionForEpisode(anime.id, epNumber - 1));
  const goNext = () => openPlayer(anime, epNumber + 1, nextEntry, resumeFractionForEpisode(anime.id, epNumber + 1));
  pcPrevBtn.onclick = goPrev;
  pcNextBtn.onclick = goNext;

  view.classList.add('active');
  // Recalcule après affichage (getBoundingClientRect renvoie 0 tant que la
  // vue était display:none) ; un petit délai laisse le layout se stabiliser.
  requestAnimationFrame(updateSubtitleFontSize);
  setTimeout(updateSubtitleFontSize, 150);
}

function loadPlayerSubtitle(entry) {
  const video = document.getElementById('playerVideo');
  const subtitleEl = document.getElementById('playerSubtitle');
  const tracks = _subtitleTracksOf(entry);
  const lang = (playerSelectedSubtitleLang && tracks[playerSelectedSubtitleLang]) ? playerSelectedSubtitleLang : Object.keys(tracks)[0];
  if (!lang) return;
  playerSelectedSubtitleLang = lang;
  const path = tracks[lang];
  const url = path.startsWith('http') ? path : API_BASE + path;
  // Format par langue si le serveur le précise un jour
  // (entry.subtitleFormats = { fr: 'ass', en: 'vtt', ... }), sinon l'ancien
  // champ unique entry.subtitleFormat, sinon vtt par défaut.
  const format = ((entry.subtitleFormats && entry.subtitleFormats[lang]) || entry.subtitleFormat || 'vtt').toLowerCase();

  // Retire toute piste précédente (cas d'un changement de langue en cours
  // de lecture, sans rouvrir le lecteur) avant d'attacher la nouvelle.
  detachAssSubtitles();
  video.querySelectorAll('track').forEach((t) => t.remove());
  subtitleEl.innerHTML = '';

  fetch(url)
    .then((res) => (res.ok ? res.text() : null))
    .then((text) => {
      if (!text) return;
      if (format === 'ass') {
        attachAssSubtitles(text);
      } else {
        const blob = new Blob([text], { type: 'text/vtt' });
        const track = document.createElement('track');
        track.kind = 'subtitles';
        track.default = true;
        track.srclang = lang;
        track.src = URL.createObjectURL(blob);
        track.addEventListener('load', () => { track.track.mode = playerSubtitlesEnabled ? 'showing' : 'hidden'; });
        video.appendChild(track);
        subtitleEl.innerHTML = '';
      }
    })
    .catch(() => {});
}

// ---- Rendu ASS fidèle : EXACTEMENT la même méthode que l'ancien site
// (voir web/index.html, window.attachJassub/detachJassub) : la librairie
// "SubtitlesOctopus" (le moteur ASS "libass-wasm", en WebAssembly — police,
// couleurs, position d'origine préservées), auto-hébergée avec le site
// (pas de CDN à l'exécution : un Worker doit être chargé depuis la même
// origine que la page) dans un dossier "octopus/" à côté de ce fichier. Si
// le script/Worker ne charge pas, on retombe silencieusement sur l'overlay
// texte — rien ne casse. ----

function loadSubtitlesOctopusScript() {
  if (window.SubtitlesOctopus) return Promise.resolve();
  if (loadSubtitlesOctopusScript._promise) return loadSubtitlesOctopusScript._promise;
  loadSubtitlesOctopusScript._promise = new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = 'octopus/subtitles-octopus.js';
    s.onload = () => resolve();
    s.onerror = () => reject(new Error('SubtitlesOctopus script failed to load'));
    document.head.appendChild(s);
  });
  return loadSubtitlesOctopusScript._promise;
}

// window.attachJassub/detachJassub : copie exacte du script de
// web/index.html de l'ancien site (mêmes options, mêmes chemins relatifs à
// octopus/).
window.attachJassub = function (videoEl, assContent, onError) {
  try {
    return new SubtitlesOctopus({
      video: videoEl,
      subContent: assContent,
      workerUrl: 'octopus/subtitles-octopus-worker.js',
      onError: function (err) {
        console.error("SubtitlesOctopus : erreur de rendu, repli sur l'overlay texte.", err);
        if (onError) onError(String((err && err.message) || err || 'erreur inconnue'));
      },
    });
  } catch (e) {
    console.error("SubtitlesOctopus : accroche échouée, repli sur l'overlay texte.", e);
    if (onError) onError(String((e && e.message) || e || 'erreur inconnue'));
    return null;
  }
};
window.detachJassub = function (instance) {
  if (instance && typeof instance.dispose === 'function') instance.dispose();
};

function attachAssSubtitles(subtitleText) {
  const video = document.getElementById('playerVideo');
  loadSubtitlesOctopusScript()
    .then(() => {
      const instance = window.attachJassub(video, subtitleText, (msg) => {
        detachAssSubtitles();
        fallbackToPlainTextCues(subtitleText);
      });
      if (!instance) { fallbackToPlainTextCues(subtitleText); return; }
      playerOctopusInstance = instance;
      applyPlayerSubtitleVisibility();
    })
    .catch(() => fallbackToPlainTextCues(subtitleText));
}

function detachAssSubtitles() {
  if (playerOctopusInstance) {
    window.detachJassub(playerOctopusInstance);
    playerOctopusInstance = null;
  }
}

// Repli texte brut (voir parseAssDialogue côté Flutter) : juste le texte
// des lignes "Dialogue:", débarrassé de ses balises de style {\...}.
function fallbackToPlainTextCues(text) {
  const video = document.getElementById('playerVideo');
  playerAssCues = parseAssCues(text);
  playerCueUpdateHandler = () => renderPlayerCue(video.currentTime);
  video.addEventListener('timeupdate', playerCueUpdateHandler);
}

function renderPlayerCue(t) {
  const subtitleEl = document.getElementById('playerSubtitle');
  if (!playerAssCues) return;
  const cue = playerAssCues.find((c) => t >= c.start && t <= c.end);
  subtitleEl.innerHTML = cue ? `<span>${cue.text.replace(/\n/g, '<br>')}</span>` : '';
}

function parseAssTime(t) {
  const m = /(\d+):(\d{2}):(\d{2})[.,](\d{2})/.exec(t || '');
  if (!m) return 0;
  return Number(m[1]) * 3600 + Number(m[2]) * 60 + Number(m[3]) + Number(m[4]) / 100;
}

function parseAssCues(text) {
  const cues = [];
  let format = [];
  let inEvents = false;
  text.split(/\r?\n/).forEach((line) => {
    if (/^\[Events\]/i.test(line)) { inEvents = true; return; }
    if (/^\[.*\]/.test(line)) { inEvents = false; return; }
    if (!inEvents) return;
    if (/^Format:/i.test(line)) {
      format = line.slice(line.indexOf(':') + 1).split(',').map((s) => s.trim().toLowerCase());
      return;
    }
    if (/^Dialogue:/i.test(line)) {
      const rest = line.slice(line.indexOf(':') + 1);
      const textIdx = format.indexOf('text');
      const startIdx = format.indexOf('start');
      const endIdx = format.indexOf('end');
      if (textIdx === -1 || startIdx === -1 || endIdx === -1) return;
      const parts = rest.split(',');
      const textPart = parts.slice(textIdx).join(',');
      const start = parseAssTime(parts[startIdx]);
      const end = parseAssTime(parts[endIdx]);
      const clean = textPart
        .replace(/\{[^}]*\}/g, '')
        .replace(/\\N/gi, '\n')
        .replace(/\\n/gi, '\n')
        .trim();
      if (clean) cues.push({ start, end, text: clean });
    }
  });
  return cues;
}

function closePlayer() {
  const view = document.getElementById('playerView');
  const wasActive = view.classList.contains('active');
  const video = document.getElementById('playerVideo');
  video.pause();
  video.removeAttribute('src');
  if (playerCueUpdateHandler) { video.removeEventListener('timeupdate', playerCueUpdateHandler); playerCueUpdateHandler = null; }
  detachAssSubtitles();
  video.querySelectorAll('track').forEach((t) => t.remove());
  video.load();
  playerAssCues = null;
  clearTimeout(playerHideTimer);
  clearTimeout(playerIdlePauseTimer);
  closeAvMenu();
  closeEpMenu();
  view.classList.remove('active', 'playing', 'buffering', 'controls-hidden', 'started', 'subtitles-off', 'idle-paused');
  if (document.fullscreenElement) document.exitFullscreen?.().catch(() => {});
  // Recalcule "Continuer à regarder" (progression enregistrée pendant cette
  // lecture) pour que la rangée soit à jour au retour sur l'accueil.
  if (allAnimes.length) renderAllRows(allAnimes);
  // Le bouton "LECTURE E1"/"REPRENDRE ÉP. X" de la bannière est calculé au
  // moment du rendu (voir renderHero) mais la bannière n'est normalement pas
  // reconstruite après avoir regardé un épisode — sans ça le bouton restait
  // bloqué sur "LECTURE E1" même après avoir enregistré une vraie
  // progression (retour utilisateur : "je suis a lepisode 17 et ya toujours
  // ecris 1 en haut"). On la reconstruit ici, sans re-télécharger les logos
  // déjà en cache (_logoUrl).
  if (heroSlides.length) renderHero();
  restartHeroAutoplay();

  // Même chose pour la grille d'épisodes de la fiche détail en dessous
  // (toujours ouverte puisque le lecteur s'affiche par-dessus, jamais
  // fermée) : sans ça, les badges "Vu"/barre de progression ne se mettaient
  // à jour qu'au prochain F5, pas en revenant simplement en arrière (retour
  // utilisateur : "ça se met que si je reload").
  if (detailCurrentAnime && Object.keys(detailCurrentVideos).length) {
    renderEpisodeSection(detailCurrentAnime, detailCurrentVideos);
  }

  if (wasActive && playerCurrentAnime) {
    pushHistoryState('#/anime/' + playerCurrentAnime.id, { view: 'detail', animeId: playerCurrentAnime.id });
  }
}

document.addEventListener('keydown', (e) => {
  const view = document.getElementById('playerView');
  if (!view.classList.contains('active')) return;
  if (e.key === 'Escape') { closePlayer(); return; }
  const video = document.getElementById('playerVideo');
  if (e.key === ' ' || e.code === 'Space') {
    e.preventDefault();
    if (!view.classList.contains('started')) { view.classList.add('started'); video.play().catch(() => {}); return; }
    if (video.paused) video.play().catch(() => {}); else video.pause();
  } else if (e.key === 'ArrowRight') {
    video.currentTime = Math.min(video.duration || Infinity, video.currentTime + 5);
  } else if (e.key === 'ArrowLeft') {
    video.currentTime = Math.max(0, video.currentTime - 5);
  } else if (e.key === 'f' || e.key === 'F') {
    if (!document.fullscreenElement) view.requestFullscreen?.().catch(() => {});
    else document.exitFullscreen?.();
  }
});

// ---------- Chargement initial ----------

let allAnimes = [];

// Construit la liste des animés du bandeau : d'abord ceux choisis à la main
// dans HERO_ANIME_IDS (dans l'ordre donné, à condition d'avoir une
// bannière), puis complété jusqu'à 8 (comme le "featured.take(8)" du vrai
// site) avec les plus récents ayant une bannière parmi ceux déjà connus.
function buildHeroSlides(knownAnimes) {
  const byId = new Map(knownAnimes.map((a) => [a.id, a]));
  const picked = [];
  const pickedIds = new Set();
  HERO_ANIME_IDS.forEach((id) => {
    const a = byId.get(id);
    if (a && a.bannerImage && !pickedIds.has(id)) {
      picked.push(a);
      pickedIds.add(id);
    }
  });
  for (const a of knownAnimes) {
    if (picked.length >= 8) break;
    if (a.bannerImage && !pickedIds.has(a.id)) {
      picked.push(a);
      pickedIds.add(a.id);
    }
  }
  return picked;
}

function showHero(slides) {
  heroSlides = slides;
  // Bandeau affiché TOUT DE SUITE (comme la bannière), sans attendre les
  // logos — chaque slide démarre avec le titre en texte (voir buildHero-
  // Slides) et le logo stylisé vient le remplacer en arrière-plan dès qu'il
  // est prêt (updateHeroSlideLogo), jamais par bouts grâce au préchargement
  // (preloadImage) avant la substitution.
  renderHero();
  restartHeroAutoplay();
  heroSlides.forEach((anime) => {
    if (anime._logoUrl) return;
    fetchTitleLogo(anime).then((logoUrl) => {
      if (!logoUrl) return;
      preloadImage(logoUrl).then((ok) => {
        if (!ok) return;
        anime._logoUrl = logoUrl;
        updateHeroSlideLogo(anime);
      });
    });
  });
}

// Chargement rapide : tout le catalogue en UN SEUL appel (voir /api/catalog
// côté serveur, qui pré-charge tout en arrière-plan et le tient à jour) —
// remplace, quand ça marche, l'ancien chargement animé par animé
// (~270 requêtes individuelles, lent surtout pour un visiteur qui n'a rien
// en cache). Retourne null si la route est indisponible ou renvoie un
// catalogue vide, pour que l'appelant retombe sur l'ancienne méthode
// (toujours conservée comme repli, voir plus bas dans init()).
// Jeton anonyme à courte durée de vie (voir /api/auth/anon-token côté
// serveur) : récupéré automatiquement ici au chargement de la page, sans
// aucune action de l'utilisateur, puis envoyé avec l'appel au catalogue.
// Même principe que Crunchyroll/Netflix — quelqu'un qui tape l'URL de
// l'API directement dans son navigateur n'a pas ce jeton et se fait
// refuser l'accès.
let _anonToken = null;
let _anonTokenExpiresAt = 0;

async function getAnonToken() {
  // Marge de 30s avant expiration réelle pour ne jamais envoyer un jeton
  // tout juste périmé (latence réseau entre la récupération et l'usage).
  if (_anonToken && Date.now() < _anonTokenExpiresAt - 30000) return _anonToken;
  try {
    const res = await fetch(`${API_BASE}/api/auth/anon-token`);
    if (!res.ok) return null;
    const data = await res.json();
    if (!data?.token) return null;
    _anonToken = data.token;
    _anonTokenExpiresAt = data.expiresAt || 0;
    return _anonToken;
  } catch {
    return null;
  }
}

async function fetchFullCatalog() {
  try {
    const token = await getAnonToken();
    if (!token) return null;
    const res = await fetch(`${API_BASE}/api/catalog`, {
      headers: { Authorization: `Bearer ${token}` },
    });
    if (!res.ok) return null;
    const data = await res.json();
    if (!Array.isArray(data?.animes) || data.animes.length === 0) return null;
    return data.animes;
  } catch {
    return null;
  }
}

async function init() {
  renderSkeletonGrid(14);
  try {
    // Sélection manuelle du bandeau, choisie dans le panel admin : lue en
    // parallèle du reste (pas bloquant si la requête est lente/absente).
    // Cette liste est privée (même la lecture demande la clé admin) — sans
    // ADMIN_KEY_FOR_FEATURED renseignée ci-dessus, on reçoit juste un 401 et
    // on retombe silencieusement sur le bandeau 100% automatique.
    try {
      if (ADMIN_KEY_FOR_FEATURED) {
        const featuredRes = await fetch(`${API_BASE}/api/admin/featured`, {
          headers: { 'x-admin-key': ADMIN_KEY_FOR_FEATURED },
        });
        if (featuredRes.ok) {
          const featuredData = await featuredRes.json();
          if (Array.isArray(featuredData?.animeIds)) HERO_ANIME_IDS = featuredData.animeIds;
        }
      }
    } catch {
      // Pas grave : le bandeau retombe sur la sélection automatique.
    }

    const bulk = await fetchFullCatalog();
    if (bulk) {
      // Chemin rapide : tout est déjà là, un seul rendu suffit. On alimente
      // aussi le cache mémoire par animé (fetchAnimeMeta) avec ce qu'on
      // vient de recevoir, pour que le reste du site (fiche détail ouverte
      // depuis une carte, relations de franchise…) n'ait pas besoin de
      // retélécharger ce qu'on a déjà.
      bulk.forEach((a) => { if (a?.id != null) animeMetaCache.set(a.id, a); });
      allAnimes = bulk;
      loadWatchProgressFromStorage();
      renderAllRows(bulk);
      const heroWanted = HERO_ANIME_IDS.length > 0
        ? HERO_ANIME_IDS.map((id) => animeMetaCache.get(id)).filter(Boolean)
        : [];
      const slides = heroWanted.length > 0 ? buildHeroSlides(heroWanted) : [];
      showHero(slides.length > 0 ? slides : bulk.filter((a) => a.bannerImage).slice(0, 8));
      return;
    }

    // --- Repli : catalogue indisponible en un seul bloc (route absente,
    // serveur pas encore à jour, etc.) — ancien chargement animé par animé,
    // plus lent mais robuste, conservé tel quel.
    const ids = await fetchPostedIds();
    if (!Array.isArray(ids) || ids.length === 0) {
      document.getElementById('rowsContainer').innerHTML =
        '<div class="empty-msg">Aucun animé posté pour le moment.</div>';
      return;
    }

    // Repli indisponible pour le cache mémoire : on tente quand même le
    // repli localStorage (loadWatchProgressFromStorage) tout de suite, les
    // entrées trouvées là appliqueront la recherche réseau en interne si
    // besoin — pas la peine d'attendre tout le catalogue animé par animé.
    loadWatchProgressFromStorage();

    // On va chercher ces animés-là en priorité, indépendamment du reste du
    // catalogue, pour que le bandeau s'affiche vite même s'ils sont loin
    // dans la liste postée.
    let heroShown = false;
    if (HERO_ANIME_IDS.length > 0) {
      const heroWanted = (await Promise.all(HERO_ANIME_IDS.map(fetchAnimeMeta))).filter(Boolean);
      const slides = buildHeroSlides(heroWanted);
      if (slides.length > 0) {
        showHero(slides);
        heroShown = true;
      }
    }

    // Tout le catalogue posté, comme sur le vrai site (aucune limite) — le
    // catalogue peut désormais dépasser les 250 animés, donc on affiche les
    // rangées au fil de l'eau (voir onProgress) plutôt que d'attendre que
    // les ~270 requêtes AniList soient TOUTES revenues avant le premier
    // rendu : la bannière et les premières rangées apparaissent dès que
    // suffisamment d'animés sont connus, le reste se complète juste après.
    const idsToLoad = ids;
    // Rangées : quelques paliers fixes plutôt qu'un re-rendu en continu —
    // chaque renderAllRows() vide et reconstruit toute la grille (comme
    // côté Flutter, un vrai setState global), donc le refaire en boucle
    // donnait l'impression que la page se rechargeait sans arrêt. On ne le
    // fait qu'à 25 %, 60 % et 100 % du catalogue.
    const progressCheckpoints = [0.25, 0.6];
    let nextCheckpoint = 0;
    const animes = (await mapWithConcurrency(idsToLoad, 24, fetchAnimeMeta, (partial, done, total) => {
      const soFar = partial.filter(Boolean);
      // Pas de sélection manuelle : bandeau automatique (8 premiers avec
      // bannière), affiché UNE SEULE FOIS dès qu'on en a assez — les logos
      // arrivés après patchent leur slide en place (updateHeroSlideLogo),
      // sans jamais reconstruire tout le bandeau.
      if (!heroShown) {
        const withBanner = soFar.filter((a) => a.bannerImage);
        if (withBanner.length >= 8 || done === total) {
          showHero(withBanner.slice(0, 8));
          heroShown = true;
        }
      }
      while (nextCheckpoint < progressCheckpoints.length && done / total >= progressCheckpoints[nextCheckpoint]) {
        nextCheckpoint++;
        renderAllRows(soFar);
      }
    })).filter(Boolean);
    allAnimes = animes;

    // Rendu final avec le catalogue complet (fige l'ordre/regroupement
    // définitif une fois tout arrivé).
    renderAllRows(animes);
    // Complète la sélection manuelle jusqu'à 8 si besoin, maintenant que le
    // catalogue complet est connu (sans jamais retirer ce qui est déjà
    // affiché : mêmes objets, juste éventuellement plus de slides à la fin).
    if (HERO_ANIME_IDS.length > 0) {
      const complete = buildHeroSlides([
        ...heroSlides,
        ...animes,
      ]);
      if (complete.length > heroSlides.length) showHero(complete);
    } else if (!heroShown) {
      showHero(animes.filter((a) => a.bannerImage).slice(0, 8));
    }
  } catch (e) {
    console.error(e);
    document.getElementById('rowsContainer').innerHTML =
      '<div class="empty-msg">Erreur de chargement : ' + e.message + '</div>';
  }
}

// ---------- Recherche (filtrage local, instantané) ----------

// Fusionne une liste déjà dédupliquée par titre (`deduped`) en utilisant
// cette fois le vrai graphe de relations AniList — nécessaire pour les cas
// comme "jojo" où deux entrées survivent au premier passage (par titre) car
// elles ne partagent aucun texte commun, mais sont bien la même franchise
// selon AniList (voir fetchFranchiseChain). On ne garde, pour chaque groupe
// fusionné, que l'entrée la plus ancienne — comme pour le passage par titre.
async function mergeDedupedByRelations(deduped) {
  if (deduped.length < 2) return deduped;
  const chains = await Promise.all(deduped.map((a) => fetchFranchiseChain(a, allAnimes)));
  // `full` (pas seulement `posted`) : deux entrées postées peuvent être
  // reliées via un maillon non posté (voir fetchFranchiseChain) — c'est
  // justement le cas qu'on veut fusionner ici.
  const idToChainIds = new Map(deduped.map((a, i) => [a.id, new Set(chains[i].full.map((m) => m.id))]));
  const dropped = new Set();
  for (let i = 0; i < deduped.length; i++) {
    if (dropped.has(deduped[i].id)) continue;
    for (let j = i + 1; j < deduped.length; j++) {
      if (dropped.has(deduped[j].id)) continue;
      const related =
        idToChainIds.get(deduped[i].id).has(deduped[j].id) ||
        idToChainIds.get(deduped[j].id).has(deduped[i].id);
      if (!related) continue;
      // Même franchise selon les relations : on garde la plus ancienne des
      // deux (celle qui reste "i" dans la boucle, puisque `deduped` est déjà
      // trié par date de sortie croissante).
      dropped.add(deduped[j].id);
    }
  }
  return deduped.filter((a) => !dropped.has(a.id));
}

let searchDebounce = null;
let currentSearchQuery = '';
document.getElementById('searchInput').addEventListener('input', (e) => {
  clearTimeout(searchDebounce);
  const q = e.target.value.trim().toLowerCase();
  searchDebounce = setTimeout(() => {
    const rowsContainer = document.getElementById('rowsContainer');
    const searchSection = document.getElementById('searchSection');
    const hero = document.getElementById('hero');
    if (document.getElementById('detailView').classList.contains('view-visible')) {
      closeDetail();
    }
    if (!q) {
      // Retour au catalogue normal : bandeau + "Continuer à regarder" +
      // rangées par catégorie (comme _searchController.text.trim().isEmpty
      // côté Flutter).
      hero.style.display = '';
      rowsContainer.style.display = '';
      searchSection.style.display = 'none';
      renderAllRows(allAnimes);
      return;
    }
    // Recherche en cours : une simple grille de résultats, pas de bandeau ni
    // de "Continuer à regarder" (même comportement que le vrai site).
    hero.style.display = 'none';
    rowsContainer.style.display = 'none';
    searchSection.style.display = '';
    document.getElementById('searchTitle').textContent = `Résultats pour "${q}"`;
    currentSearchQuery = q;
    const filtered = allAnimes.filter((a) => {
      const t = (a.title?.english || '') + ' ' + (a.title?.romaji || '');
      return t.toLowerCase().includes(q);
    });
    // Une seule fiche par franchise dans les résultats (la saison 1 de
    // préférence, voir dedupeFranchises) — les autres saisons/films de la
    // même franchise restent accessibles via les badges sur la fiche détail.
    // Passage 1 (instantané) : heuristique par titre.
    const deduped = dedupeFranchises(filtered);
    renderSearchGrid(deduped);

    // Passage 2 (asynchrone) : fusion supplémentaire via les vraies relations
    // AniList — couvre les franchises dont les parties n'ont pas de nom en
    // commun (ex: "jojo" -> JoJo's Bizarre Adventure / STEEL BALL RUN, reliées
    // par une chaîne SEQUEL/PREQUEL mais pas par le texte du titre). On
    // réaffiche seulement si la recherche n'a pas changé entre-temps et si ça
    // réduit effectivement le nombre de résultats affichés.
    mergeDedupedByRelations(deduped).then((merged) => {
      if (currentSearchQuery !== q) return;
      if (merged.length < deduped.length) {
        renderSearchGrid(merged);
      }
    });
  }, 120); // léger debounce, juste pour éviter de re-filtrer à CHAQUE frappe brute
});

init().then(() => restoreFromHash(location.hash));
</script>
