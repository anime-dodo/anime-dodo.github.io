<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AnimeDodo — Prototype accueil (HTML/CSS/JS)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #000000;
    --card-title: #ffffff;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: #fff;
    /* Le vrai site (voir ThemeData(fontFamily: 'Roboto') dans main.dart) utilise
       Roboto pour toute l'interface — TrebuchetMS n'y sert QUE pour les
       sous-titres vidéo, jamais pour le texte de l'appli elle-même. */
    font-family: "Roboto", "Segoe UI", Arial, sans-serif;
    overflow-x: hidden;
  }

  /* ---------- Barre du haut : reprend exactement la SliverAppBar Flutter
     (toolbarHeight 64, noir plein tout le temps, pas de dégradé) ---------- */
  .topbar {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 50;
    height: 64px;
    display: flex;
    align-items: center;
    gap: 24px;
    padding: 0 20px;
    background: #000;
  }
  /* Compense le retrait de la barre du flux normal (position: fixed) pour
     que le bandeau/le reste du contenu ne démarre pas caché dessous. */
  body { padding-top: 64px; }
  .logo { font-weight: 700; font-size: 20px; color: #fff; white-space: nowrap; cursor: pointer; }
  .search-wrap { max-width: 300px; width: 100%; }
  .search-field {
    height: 38px;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 0 12px;
    border-radius: 10px;
    background: rgba(255,255,255,0.08);
  }
  .search-field svg { flex: none; opacity: 0.7; }
  .search-input {
    flex: 1;
    border: none;
    outline: none;
    background: transparent;
    color: #fff;
    font-size: 14px;
    font-family: inherit;
  }
  .search-input::placeholder { color: rgba(255,255,255,0.5); }
  .topbar-spacer { flex: 1; }
  .icon-btn {
    width: 40px; height: 40px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    background: transparent;
    border: none;
    cursor: pointer;
    color: #fff;
    transition: background 0.15s ease;
  }
  .icon-btn:hover { background: rgba(255,255,255,0.1); }

  /* ---------- Hero / carrousel bannière ---------- */
  .hero {
    position: relative;
    width: 100%;
    /* Même formule que la version Flutter : clamp(hauteur écran - 192, 682, 961) */
    height: clamp(420px, calc(100vh - 192px), 961px);
    overflow: hidden;
    background: #000;
  }
  .hero-slide {
    position: absolute;
    inset: 0;
    opacity: 0;
    transition: opacity 0.6s ease;
    will-change: opacity;
  }
  .hero-slide.active { opacity: 1; z-index: 1; }
  .hero-slide img.banner {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center 27%; /* Alignment(0, -0.55) côté Flutter : biaisé vers le haut */
    display: block;
  }
  .hero-gradient {
    position: absolute;
    inset: 0;
    /* Dégradé vertical transparent -> noir 60% -> noir 98%, stops 0/0.55/1 (identique au code Flutter) */
    background: linear-gradient(to bottom,
      rgba(0,0,0,0) 0%,
      rgba(0,0,0,0.6) 55%,
      rgba(0,0,0,0.98) 100%);
  }
  .hero-content {
    position: absolute;
    left: 24px;
    right: 24px;
    bottom: 52px;
    z-index: 2;
    max-width: 720px;
  }
  .hero-logo-img {
    max-width: 480px;
    max-height: 150px;
    object-fit: contain;
    object-position: left bottom;
    display: block;
  }
  .hero-title-text {
    font-size: 28px;
    font-weight: 800;
    letter-spacing: 0.2px;
    text-shadow: 0 0 12px rgba(0,0,0,0.85);
    margin: 0;
  }
  .hero-genres {
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.3px;
    color: rgba(255,255,255,0.8);
    margin: 8px 0 0 0;
  }
  .hero-desc {
    font-size: 13px;
    line-height: 1.4;
    color: rgba(255,255,255,0.85);
    max-width: 560px;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
    margin: 10px 0 0 0;
  }
  .hero-actions { display: flex; gap: 10px; margin-top: 16px; }
  .btn {
    padding: 11px 20px;
    border-radius: 8px;
    border: 1.5px solid transparent;
    font-weight: 700;
    font-size: 13.5px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    letter-spacing: 0.3px;
    transition: transform 0.12s ease, opacity 0.12s ease;
  }
  .btn:hover { transform: scale(1.03); }
  .btn-primary { background: #fff; color: #111; }
  .btn-secondary { background: transparent; color: #fff; border-color: rgba(255,255,255,0.7); }

  .hero-arrow {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    width: 40px; height: 40px;
    border-radius: 50%;
    background: rgba(0,0,0,0.92);
    box-shadow: 0 2px 6px rgba(0,0,0,0.5);
    border: none;
    color: #fff;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    z-index: 3;
    font-size: 18px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.15s ease, background 0.15s ease;
  }
  /* Visibles seulement au survol de la bannière (pas en permanence). */
  .hero:hover .hero-arrow {
    opacity: 1;
    pointer-events: auto;
  }
  .hero-arrow:hover { background: #000; }
  .hero-arrow.left { left: 16px; }
  .hero-arrow.right { right: 16px; }

  /* Points de pagination EXACTEMENT comme sur le vrai site Flutter (voir
     _HeroCarousel) : ronds blancs 38% (inactifs, 9x9) / pilule blanche pleine
     (actif, 22x9), alignés à gauche en bas du bandeau — PAS à la suite des
     boutons comme sur Crunchyroll, en absolu par-dessus la bannière. */
  .hero-progress {
    position: absolute;
    left: 16px;
    bottom: 6px;
    z-index: 2;
    display: flex;
  }
  .progress-seg {
    padding: 14px 8px;
    cursor: pointer;
  }
  .progress-seg-fill {
    width: 9px;
    height: 9px;
    border-radius: 5px;
    background: rgba(255,255,255,0.38);
    transition: width 250ms ease, background 250ms ease;
  }
  .progress-seg-fill.active {
    width: 22px;
    background: #fff;
  }

  /* ---------- Rangées (mêmes tailles que _RowAnimeCard/_AnimeRow) ---------- */
  .row-section {
    padding: 20px 16px 4px 16px;
  }
  .row-section.continue-watching { padding-top: 8px; }
  .row-title {
    font-size: 18px;
    font-weight: 700;
    margin: 0 4px 12px 4px;
  }
  /* _ArrowScrollRow : le conteneur relatif porte les flèches, positionnées
     en dehors de la liste (left:-4/right:-4) et centrées sur la HAUTEUR DE
     LA JAQUETTE seulement (pas toute la rangée, qui inclut le titre en
     dessous) — visibles seulement quand il y a effectivement de quoi
     défiler dans cette direction (comme _updateArrows côté Flutter). */
  .row-wrap { position: relative; }
  .row-scroll {
    display: flex;
    gap: 16px;
    overflow-x: auto;
    padding: 0 4px 28px 4px;
    scroll-behavior: smooth;
    scrollbar-width: none;
  }
  .row-scroll::-webkit-scrollbar { display: none; }
  .row-arrow {
    position: absolute;
    top: 0;
    height: 375px; /* posterHeight — jaquette plus de zone de survol réservée au-dessus depuis que seule l'image (pas le cadre) zoome au survol */
    display: flex;
    align-items: center;
    z-index: 10;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.15s ease;
  }
  /* Visible seulement quand ON survole la rangée ET qu'il reste effectivement
     de quoi défiler dans cette direction (classe "visible" posée par le JS
     selon la position de scroll). */
  .row-wrap:hover .row-arrow.visible { opacity: 1; pointer-events: auto; }
  .row-arrow.left { left: -4px; }
  .row-arrow.right { right: -4px; }
  .row-arrow button {
    width: 40px; height: 40px;
    border-radius: 50%;
    background: rgba(0,0,0,0.92);
    box-shadow: 0 2px 6px rgba(0,0,0,0.5);
    border: none;
    color: #fff;
    font-size: 18px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    transition: background 0.15s ease;
  }
  .row-arrow button:hover { background: #000; }

  .grid-results {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 24px 16px;
    padding: 8px 20px 28px 20px;
    align-items: start;
  }
  /* Les cartes ont une largeur FIXE (250px, comme _RowAnimeCard) pour les
     rangées horizontales — mais dans cette grille de résultats de
     recherche, chaque carte doit plutôt remplir sa cellule (largeur
     variable selon le nombre de colonnes), sinon elle déborde par-dessus
     ses voisines. Pas besoin non plus de la zone de survol réservée
     au-dessus (_hoverHeadroom) : rien n'y défile horizontalement, donc rien
     ne peut y être rogné. */
  .grid-results .card { width: 100%; }
  .grid-results .card-poster-wrap { height: auto; display: block; }
  .grid-results .card-poster {
    width: 100%;
    height: auto;
    aspect-ratio: 2 / 3;
  }

  .card {
    position: relative;
    width: 250px;
    flex: none;
    opacity: 0;
    transform: translateY(12px);
    animation: cardIn 0.45s ease forwards;
    cursor: pointer;
  }
  @keyframes cardIn {
    to { opacity: 1; transform: translateY(0); }
  }
  /* Cadre de la jaquette À TAILLE FIXE (ne grandit plus lui-même au
     survol) : même principe que .ep-thumb-wrap dans la grille d'épisodes de
     la fiche détail (voir plus bas, un peu avant .episode-grid), qui n'a
     jamais eu ce genre de souci. Les 3 essais précédents (jaquette ENTIÈRE
     zoomée via transform:scale, avec le dégradé+boutons soit dedans soit à
     côté synchronisé par divers moyens) ont chacun cassé quelque chose :
     texte flou, désynchronisation, ou un aller-retour flou/net/saccadé une
     fois les deux approches combinées (retour utilisateur). Seule l'IMAGE à
     l'intérieur zoome désormais (voir .card-poster img plus bas) ; le
     cadre (bords arrondis, dégradé, boutons, badges) ne bouge JAMAIS, donc
     rien ne peut jamais s'en désynchroniser ni être flouté par un zoom. */
  .card-poster-wrap {
    height: 375px;
    position: relative;
  }
  .card-poster {
    position: relative;
    width: 250px;
    height: 375px; /* ratio 2:3, identique à posterWidth * 3/2 */
    border-radius: 10px;
    overflow: hidden;
    background: #1c1c2e;
    transition: box-shadow 0.16s ease;
  }
  .card:hover .card-poster {
    box-shadow: 0 8px 16px rgba(0,0,0,0.5);
  }
  .card-poster img {
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
    transition: transform 0.22s ease;
  }
  /* Le zoom se fait UNIQUEMENT sur l'image, contenue/rognée par le cadre
     fixe ci-dessus (overflow:hidden) — jamais sur le cadre lui-même. */
  .card:hover .card-poster img { transform: scale(1.08); }
  .badge-row {
    position: absolute;
    left: 6px; top: 6px;
    display: flex;
    gap: 4px;
    z-index: 3;
  }
  .badge-pill {
    padding: 2px 6px;
    border-radius: 4px;
    font-size: 9px;
    font-weight: 800;
    color: #fff;
    letter-spacing: 0.2px;
  }
  .badge-vostfr { background: rgba(211,47,47,0.92); }
  .badge-vf { background: rgba(40,53,147,0.92); }

  .fav-btn {
    position: absolute;
    top: 6px; right: 6px;
    z-index: 3;
    width: 30px; height: 30px;
    border-radius: 50%;
    background: rgba(0,0,0,0.54);
    border: none;
    color: #fff;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
  }

  /* Reprend _CardHoverActions à l'identique : dégradé transparent -> noir
     80% (stops 35%/100%), boutons alignés en bas en RANGÉE (Infos à gauche,
     Ep1/Lecture à droite) — pas centrés au milieu de la jaquette.
     De retour EN ENFANT de .card-poster (comme à l'origine) : maintenant
     que .card-poster ne zoome plus elle-même (seule l'image à l'intérieur
     zoome, voir plus haut), ce bloc ne bouge jamais, donc son texte ne peut
     plus jamais être flouté ni désynchronisé par un quelconque zoom — plus
     besoin d'astuce de contre-échelle. */
  .card-hover-actions {
    position: absolute;
    inset: 0;
    z-index: 2;
    background: linear-gradient(to bottom, transparent 35%, rgba(0,0,0,0.8) 100%);
    display: flex;
    align-items: flex-end;
    padding: 10px;
    gap: 8px;
    opacity: 0;
    transition: opacity 0.16s ease;
  }
  .card:hover .card-hover-actions { opacity: 1; }
  .card-hover-actions .btn {
    flex: 1;
    justify-content: center;
    padding: 8px 6px;
    font-size: 13px;
    white-space: nowrap;
  }
  /* .btn a par défaut un léger agrandissement à son propre survol
     (règle générique .btn:hover plus haut dans ce fichier) : annulé ici
     pour un rendu plus stable (l'image derrière zoome déjà). */
  .card-hover-actions .btn:hover { transform: none; }

  /* ---------- Carte "Continuer à regarder" (_ContinueWatchingCard) ---------- */
  .cw-bottom-bar {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    z-index: 3;
    background: rgba(0,0,0,0.54);
    padding: 5px 6px;
    display: flex;
    align-items: center;
    gap: 4px;
    font-size: 12px;
    font-weight: 600;
    color: #fff;
  }
  .cw-progress {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    z-index: 4;
    height: 6px;
    background: rgba(255,255,255,0.24);
  }
  .cw-progress-fill { height: 100%; background: var(--player-accent); }
  /* Au survol, on laisse la place aux boutons Infos/Continuer (qui reprennent
     déjà l'info "reprendre") plutôt que de les superposer à la barre
     "Épisode N"/à la barre de progression, qui se chevauchaient. */
  .card:hover .cw-bottom-bar,
  .card:hover .cw-progress { opacity: 0; transition: opacity 0.12s ease; }
  .cw-bottom-bar, .cw-progress { transition: opacity 0.12s ease; }
  .cw-remove {
    position: absolute;
    top: 4px; right: 4px;
    z-index: 3;
    width: 28px; height: 28px;
    border-radius: 50%;
    background: rgba(0,0,0,0.54);
    border: none;
    color: #fff;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
  }

  .card-title {
    margin-top: 8px;
    font-size: 15.5px;
    font-weight: 600;
    /* 3 lignes au lieu d'une seule tronquée à 1 ligne — un titre long
       ("Mobile Suit Gundam Iron-Blooded Orphans"...) devenait
       illisible/indistinguable des autres cartes d'une même franchise avec
       juste "Mobile Suit Gundam ..." (retour utilisateur, 2 lignes
       restaient encore trop courtes pour les titres les plus longs). */
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
    line-height: 1.25;
  }
  .card-genres {
    margin-top: 3px;
    font-size: 13px;
    color: rgba(255,255,255,0.55);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .skeleton-card .card-poster {
    background: linear-gradient(100deg, #1c1c2e 30%, #26263a 50%, #1c1c2e 70%);
    background-size: 200% 100%;
    animation: shimmer 1.3s linear infinite;
  }
  @keyframes shimmer {
    to { background-position: -200% 0; }
  }

  .empty-msg {
    text-align: center;
    color: rgba(255,255,255,0.7);
    padding: 60px 20px;
  }

  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: #222;
    color: #fff;
    padding: 12px 20px;
    border-radius: 10px;
    font-size: 13px;
    opacity: 0;
    transition: opacity 0.25s ease, transform 0.25s ease;
    z-index: 200;
    pointer-events: none;
    max-width: 90vw;
    text-align: center;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ---------- Transition d'ouverture "premium" (carte -> fiche détail) ----------
     Zoom depuis la jaquette cliquée (clone flottant) + fondu croisé entre la
     vue accueil et la vue fiche détail, comme une transition "shared element"
     façon appli premium (Netflix/Crunchyroll), plutôt qu'un simple saut de
     page instantané. */
  .nav-transition-overlay {
    position: fixed;
    inset: 0;
    background: #000;
    opacity: 0;
    z-index: 998;
    pointer-events: none;
    transition: opacity 420ms ease;
  }
  .nav-transition-overlay.show { opacity: 0.55; }
  .transition-clone {
    position: fixed;
    z-index: 999;
    overflow: hidden;
    border-radius: 10px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.6);
    pointer-events: none;
    transform-origin: center center;
    /* Zoom léger + fondu SUR PLACE (pas de morphing de largeur/hauteur vers
       la forme de la bannière : ça déformait l'image, une jaquette portrait
       étirée en bandeau large ne montrait plus qu'une fine bande méconnaissable). */
    transition: transform 420ms cubic-bezier(.2,.8,.2,1), opacity 420ms ease;
  }
  .transition-clone img { width: 100%; height: 100%; object-fit: cover; display: block; }

  #homeView {
    transition: opacity 360ms ease, transform 360ms cubic-bezier(.2,.8,.2,1);
  }
  #homeView.view-hidden {
    opacity: 0;
    transform: scale(0.98);
    pointer-events: none;
  }
  /* La fiche détail, elle, ne doit JAMAIS être plus petite que l'écran
     pendant sa transition d'entrée (pas de scale ici) : un scale(0.98)
     laissait un petit liseré de fond visible sur les bords tant qu'elle
     n'avait pas fini d'agrandir — seul un fondu d'opacité, sans redimensionner. */
  .detail-view {
    display: none;
    opacity: 0;
    transition: opacity 320ms ease;
    pointer-events: none;
  }
  .detail-view.view-visible {
    display: block;
    opacity: 1;
    pointer-events: auto;
  }

  /* ---------- Fiche détail (DetailScreen) ---------- */
  .detail-banner {
    position: relative;
    width: 100%;
    height: clamp(420px, calc(100vh - 192px), 961px);
    overflow: hidden;
    background: #1c1c2e;
  }
  .detail-banner img.banner {
    width: 100%; height: 100%;
    object-fit: cover;
    object-position: center 27%;
    display: block;
  }
  .detail-gradient {
    position: absolute;
    inset: 0;
    /* stops/alphas identiques à ceux de DetailScreen.build() côté Flutter :
       [0, 0.4, 0.8, 1.0] -> alpha [0, 0, 0.6, 1.0]. */
    background: linear-gradient(to bottom,
      rgba(0,0,0,0) 0%,
      rgba(0,0,0,0) 40%,
      rgba(0,0,0,0.6) 80%,
      rgba(0,0,0,1) 100%);
  }
  .detail-banner-content {
    position: absolute;
    left: 24px; right: 24px; bottom: 28px;
    z-index: 2;
    max-width: 900px;
  }
  .detail-logo-img {
    max-width: 560px;
    max-height: 170px;
    object-fit: contain;
    object-position: left bottom;
    display: block;
  }
  .detail-title-text {
    font-size: 34px;
    font-weight: 800;
    letter-spacing: 0.2px;
    text-shadow: 0 0 12px rgba(0,0,0,0.85);
    margin: 0;
  }
  .detail-content { padding: 24px 24px 40px 24px; }
  .detail-title-below {
    font-size: 30px;
    font-weight: 800;
    margin: 0 0 16px 0;
  }
  .detail-chips {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 10px;
    margin-bottom: 20px;
  }
  .chip {
    padding: 8px 14px;
    border-radius: 20px;
    display: inline-flex;
    align-items: center;
    gap: 7px;
    font-size: 16px;
    font-weight: 600;
  }
  .chip-star { background: rgba(255,193,7,0.15); color: #ffc107; }
  .chip-tv { background: rgba(100,255,218,0.15); color: #64ffda; }
  /* Rangée "Saison 1 / Saison 2 / Film" etc. sur la fiche détail, quand
     l'animé fait partie d'une franchise à plusieurs entrées (voir
     getFranchiseGroupKey côté JS). */
  .detail-franchise-row {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin: -6px 0 20px;
  }
  .franchise-badge {
    padding: 7px 16px;
    border-radius: 20px;
    background: rgba(255,255,255,0.08);
    color: #ccc;
    font-size: 14px;
    font-weight: 600;
    border: 1px solid transparent;
    cursor: pointer;
    transition: background 0.15s ease, color 0.15s ease;
  }
  .franchise-badge:hover { background: rgba(255,255,255,0.16); color: #fff; }
  .franchise-badge.active {
    background: #7C4DFF;
    color: #fff;
  }
  .detail-fav-btn {
    width: 50px; height: 50px;
    border-radius: 50%;
    background: rgba(0,0,0,0.54);
    border: none;
    color: #fff;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
  }
  .detail-section-title { font-size: 21px; font-weight: 700; margin: 0; }
  .detail-synopsis-section { margin-bottom: 24px; }
  .detail-synopsis {
    font-size: 17px;
    line-height: 1.6;
    color: rgba(255,255,255,0.75);
    margin: 10px 0 0 0;
  }
  .detail-episodes-header {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 16px;
    margin-bottom: 12px;
  }
  .lang-toggle {
    padding: 3px;
    border-radius: 22px;
    background: rgba(255,255,255,0.04);
    display: inline-flex;
    gap: 4px;
  }
  .lang-toggle button {
    padding: 6px 12px;
    border-radius: 20px;
    border: none;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    color: rgba(255,255,255,0.7);
    background: rgba(255,255,255,0.08);
  }
  .lang-toggle button.active.vostfr { background: #D32F2F; color: #fff; }
  .lang-toggle button.active.vf { background: #283593; color: #fff; }
  .lang-badge-fixed {
    padding: 6px 12px;
    border-radius: 20px;
    background: #D32F2F;
    color: #fff;
    font-size: 13px;
    font-weight: 700;
  }
  .episode-grid {
    display: grid;
    /* Même cible que _EpisodeButton côté Flutter (targetCardWidth: 300,
       spacing: 22) : auto-fill avec minmax(300px,1fr) fait exactement la
       même chose que son calcul de colonnes + élargissement des cartes pour
       remplir toute la largeur (donnait 8 cartes trop petites/serrées avec
       un seuil de 260px, au lieu des ~7 du vrai site). */
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 22px;
  }
  .ep-card { cursor: pointer; }
  .ep-thumb-wrap {
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 9;
    border-radius: 10px;
    overflow: hidden;
    background: rgba(255,255,255,0.05);
    border: 1px solid transparent;
    display: block;
    transition: box-shadow 0.16s ease;
  }
  /* Le zoom au survol se fait UNIQUEMENT sur l'image, jamais sur le cadre
     lui-même (qui reste à taille fixe) : contrairement aux jaquettes des
     rangées d'accueil (qui ont une zone de "headroom" réservée au-dessus
     pour grandir sans être rognées), une grille verticale dense comme
     celle-ci n'a pas cet espace — faire grandir le cadre entier provoquait
     un petit "saut"/jitter au survol à cause du recalcul de grille. */
  .ep-thumb-wrap img {
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
    transition: transform 0.22s ease;
  }
  .ep-card:hover .ep-thumb-wrap img { transform: scale(1.08); }
  .ep-thumb-wrap.no-video { border-color: rgba(255,255,255,0.24); }
  .ep-thumb-wrap.no-thumb {
    background: rgba(100,255,218,0.15);
    border: 1px solid #64ffda;
    display: flex; align-items: center; justify-content: center;
  }
  .ep-placeholder {
    width: 100%; height: 100%;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 6px;
    color: rgba(255,255,255,0.4);
    font-size: 12px;
    font-weight: 600;
    text-align: center;
    padding: 8px;
  }
  .ep-play-icon {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 44px; height: 44px;
    border-radius: 50%;
    background: rgba(0,0,0,0.5);
    display: flex; align-items: center; justify-content: center;
    transition: transform 0.16s ease, background 0.16s ease;
  }
  .ep-badge {
    position: absolute;
    top: 6px; right: 6px;
    background: rgba(0,0,0,0.65);
    border-radius: 4px;
    padding: 2px 6px;
    font-size: 11px;
    font-weight: 600;
    color: #fff;
  }
  .ep-preview-btn {
    position: absolute;
    top: -6px; left: -6px;
    width: 22px; height: 22px;
    border-radius: 50%;
    background: #ff5252;
    border: none;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
  }
  .ep-label { margin-top: 9px; font-size: 16px; font-weight: 600; transition: color 0.15s ease; }
  /* Progression façon Crunchyroll sur les vignettes d'épisodes : barre en
     bas de la vignette pour un épisode en cours, badge "X min restantes" ou
     "Vu" en bas à droite (séparé du badge de durée totale, en haut à
     droite, qui reste affiché pour les épisodes jamais commencés), et
     vignette assombrie + icône de relecture pour un épisode déjà terminé. */
  .ep-thumb-wrap.ep-watched img { filter: brightness(0.45); }
  .ep-progress-track {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    height: 6px;
    background: rgba(255,255,255,0.28);
  }
  .ep-progress-fill { height: 100%; background: var(--player-accent); }
  .ep-status-badge {
    position: absolute;
    bottom: 10px; right: 6px;
    background: rgba(0,0,0,0.7);
    border-radius: 4px;
    padding: 2px 6px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.3px;
    text-transform: uppercase;
    color: #fff;
  }
  /* Animation au survol : l'image zoome légèrement (sans faire bouger/
     grandir le cadre, voir commentaire ci-dessus), une ombre apparaît, et le
     titre s'éclaircit. */
  .ep-card:hover .ep-thumb-wrap {
    box-shadow: 0 8px 20px rgba(0,0,0,0.55);
  }
  .ep-card:hover .ep-play-icon {
    transform: translate(-50%, -50%) scale(1.12);
    background: rgba(0,0,0,0.68);
  }
  .ep-card:not(.no-video):hover .ep-label { color: #fff; }
  .ep-card.no-video { cursor: default; }
  .ep-card.no-video .ep-label { color: rgba(255,255,255,0.4); }
  .detail-loading { padding: 20px 0; color: rgba(255,255,255,0.6); font-size: 14px; }

  /* ---------- Lecteur vidéo (VideoPlayerScreen) ----------
     Calqué directement sur video_player_screen.dart de l'ancien site :
     - violet Colors.deepPurpleAccent (#7C4DFF) pour le bouton central, le
       slider de progression et le halo — PAS le violet du thème général.
     - barre du haut minimale (retour + titre), pas de sélecteur de langue.
     - gros bouton lecture central visible UNIQUEMENT avant le tout premier
       lancement de la lecture, jamais aux pauses suivantes.
     - sous-titres en texte simple à contour noir (ombres), SANS pastille de
       fond derrière.
     - reculer/avancer 5s (pas 10s), volume en blanc (pas violet), menu
       "Audio et sous-titres" ancré en bas à droite plutôt que des pastilles
       VOSTFR/VF dans la barre du haut.
     - la barre de contrôle se cache après 2s d'inactivité pendant la
       lecture. */
  :root { --player-accent: #7C4DFF; }
  .player-view {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 500;
    background: #000;
  }
  .player-view.active { display: flex; }
  .player-body {
    position: relative;
    flex: 1;
    width: 100%;
    background: #000;
    overflow: hidden;
    cursor: default;
  }
  .player-body video {
    position: absolute;
    inset: 0;
    width: 100%; height: 100%;
    object-fit: contain;
    background: #000;
  }

  .player-top-gradient {
    position: absolute;
    left: 0; right: 0; top: 0;
    z-index: 4;
    background: linear-gradient(to bottom, rgba(0,0,0,0.6) 0%, transparent 100%);
    opacity: 1;
    transition: opacity 0.2s ease;
  }
  .player-view.controls-hidden .player-top-gradient { opacity: 0; pointer-events: none; }
  .player-topbar {
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 20px 24px;
  }
  .pc-back { width: 84px; height: 84px; }
  .pc-back svg { width: 42px; height: 42px; }
  /* Comme sur Netflix, PAS de titre dans la barre du haut (juste retour +
     signalement) — le titre vit dans la barre du bas, centré entre les deux
     groupes de boutons, en assez gros et en gras (pas un sous-titre discret). */
  .player-title {
    font-size: 20px;
    font-weight: 700;
    color: #fff;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    text-align: center;
    justify-self: center;
    max-width: 100%;
    padding: 0 8px;
  }
  .player-topbar-spacer { flex: 1; }
  /* Bouton en haut à droite : au lieu du drapeau "signaler ce contenu" de
     Netflix (pas pertinent ici, on n'héberge pas de contenu généré par les
     utilisateurs), on propose "signaler un problème de lecture" — ça
     s'articule directement avec le pipeline de détection d'épisodes morts
     déjà en place côté serveur (un jour, ce clic pourra alimenter la même
     file que le scan admin). Pour l'instant ça confirme juste la prise en
     compte à l'utilisateur. */
  .pc-report {
    width: 84px; height: 84px;
  }
  .pc-report svg { width: 36px; height: 36px; }
  .pc-report svg { transition: transform 0.18s ease; }
  .pc-report:hover svg { transform: rotate(-8deg) scale(1.1); }

  /* Sous-titre : texte blanc gras avec contour noir (8 ombres directionnelles
     + une ombre portée douce), sans fond — reproduit le style
     TrebuchetMS/Outline du rendu maison Flutter. */
  .player-subtitle {
    position: absolute;
    left: 16px; right: 16px; bottom: 28px;
    text-align: center;
    pointer-events: none;
    z-index: 2;
    transition: bottom 0.2s ease;
  }
  .player-subtitle span {
    display: inline-block;
    color: #fff;
    font-family: "TrebuchetMS", "Trebuchet MS", "Segoe UI", sans-serif;
    font-weight: 700;
    /* Taille et épaisseur du contour recalculées en JS (updateSubtitleFontSize)
       d'après la taille réelle du lecteur, exactement comme côté Flutter :
       fontSize = min(h*42/360, w*42/640).clamp(16,48),
       outlineWidth = (fontSize/16).clamp(1.5,3.0). Les valeurs par défaut
       ci-dessous ne servent qu'avant le premier calcul. */
    font-size: var(--sub-font-size, 24px);
    line-height: 1.08;
    white-space: pre-line;
    text-shadow:
      calc(-1 * var(--sub-outline, 1.5px)) calc(-1 * var(--sub-outline, 1.5px)) 0 #000,
      var(--sub-outline, 1.5px) calc(-1 * var(--sub-outline, 1.5px)) 0 #000,
      calc(-1 * var(--sub-outline, 1.5px)) var(--sub-outline, 1.5px) 0 #000,
      var(--sub-outline, 1.5px) var(--sub-outline, 1.5px) 0 #000,
      calc(-1 * var(--sub-outline, 1.5px)) 0 0 #000,
      var(--sub-outline, 1.5px) 0 0 #000,
      0 calc(-1 * var(--sub-outline, 1.5px)) 0 #000,
      0 var(--sub-outline, 1.5px) 0 #000,
      0 2px 2px rgba(0,0,0,0.85);
  }
  .player-view.controls-hidden .player-subtitle { bottom: 24px; }
  .player-view:not(.controls-hidden) .player-subtitle { bottom: 84px; }
  .player-view.subtitles-off .player-subtitle { display: none !important; }
  .player-view.subtitles-off canvas.libassjs-canvas,
  .player-view.subtitles-off .libassjs-canvas-parent { display: none !important; }

  /* Gros bouton lecture central : dégradé radial violet + halo, comme
     _buildStartOverlay côté Flutter — disparaît définitivement une fois la
     lecture lancée pour la première fois (ne revient jamais aux pauses
     suivantes). */
  .player-start-btn {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 80px; height: 80px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, var(--player-accent), #6a3fd6);
    border: none;
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    z-index: 3;
    box-shadow: 0 0 0 0 transparent, 0 6px 14px rgba(0,0,0,0.3);
    filter: drop-shadow(0 0 28px rgba(124,77,255,0.45));
    transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.2s ease;
  }
  .player-start-btn:hover {
    transform: translate(-50%, -50%) scale(1.08);
    filter: drop-shadow(0 0 38px rgba(124,77,255,0.65));
  }
  .player-start-btn:active { transform: translate(-50%, -50%) scale(0.95); }
  .player-view.started .player-start-btn { display: none; }

  /* Barre de contrôles du bas : se cache après 2s d'inactivité pendant la
     lecture (comme _resetHideTimer côté Flutter), réapparaît au moindre
     mouvement de souris/tap. */
  .player-controls {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    z-index: 4;
    background: linear-gradient(to top, rgba(0,0,0,0.86) 0%, rgba(0,0,0,0.4) 60%, transparent 100%);
    /* Ensemble tiré vers le bas : moins d'espace au-dessus de la barre de
       progression et moins en dessous des boutons, pour que tout le bloc
       colle plus bas, plus près du bord — comme demandé. */
    padding: 14px 32px 12px 32px;
    opacity: 1;
    transition: opacity 0.2s ease;
  }
  .player-view.controls-hidden .player-controls { opacity: 0; pointer-events: none; }
  /* Ligne de progression : comme sur Netflix, la barre ET le compteur de
     temps sont sur leur propre ligne, au-dessus de la rangée de boutons —
     pas mélangés avec les boutons comme avant. Espace resserré pour que la
     barre elle-même descende plus près des boutons. */
  .player-seek-row { display: flex; align-items: center; gap: 12px; margin: 0 0 6px 0; }
  /* Reprise de lecture (18 min la dernière fois, etc.) : tant que la durée
     réelle de la vidéo n'est pas encore connue, la barre ne peut QUE
     afficher 0:00 (pas de vraie position tant qu'on n'a pas video.duration)
     — on la masque le temps de ce calcul plutôt que de laisser voir "0:00"
     une fraction de seconde avant qu'elle ne saute à la bonne position
     (retour utilisateur : "je veux qu'elle soit direct au bon endroit").
     Seule la barre (pas le reste des contrôles) est concernée. */
  .player-view.resuming .player-seek-row { visibility: hidden; }
  .player-seek {
    -webkit-appearance: none;
    appearance: none;
    flex: 1;
    height: 5px;
    border-radius: 4px;
    /* Le "remplissage" violet à gauche du curseur est peint à la main via un
       dégradé mis à jour en JS (updateSeekFill) : -webkit-appearance:none
       désactive le remplissage natif que accent-color donnerait sinon. */
    background: linear-gradient(to right, var(--player-accent) 0%, var(--player-accent) 0%, rgba(255,255,255,0.28) 0%, rgba(255,255,255,0.28) 100%);
    outline: none;
    cursor: pointer;
    margin: 0;
    accent-color: var(--player-accent);
    transition: height 0.15s ease;
  }
  .player-seek:hover { height: 7px; }
  /* Le curseur (point violet) reste visible en permanence, comme le point
     rouge de Netflix sur sa barre — pas juste au survol. */
  .player-seek::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 14px; height: 14px;
    border-radius: 50%;
    background: var(--player-accent);
    cursor: pointer;
    box-shadow: 0 0 0 0 rgba(124,77,255,0);
    transition: transform 0.15s ease, box-shadow 0.15s ease, width 0.15s ease, height 0.15s ease;
  }
  .player-seek:hover::-webkit-slider-thumb,
  .player-seek:active::-webkit-slider-thumb {
    width: 16px; height: 16px;
    box-shadow: 0 0 0 8px rgba(124,77,255,0.18);
  }
  .player-seek::-moz-range-thumb {
    width: 14px; height: 14px;
    border: none;
    border-radius: 50%;
    background: var(--player-accent);
    cursor: pointer;
    transition: transform 0.15s ease;
  }
  .player-seek:hover::-moz-range-thumb,
  .player-seek:active::-moz-range-thumb { transform: scale(1.15); }
  /* Grille à 3 colonnes : groupe de boutons à gauche, titre parfaitement
     centré au milieu (quel que soit le nombre de boutons de chaque côté),
     groupe de boutons à droite — comme la disposition Netflix. */
  .player-controls-row {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    column-gap: 12px;
  }
  .pc-group { display: flex; align-items: center; gap: 10px; }
  .pc-group-left { justify-self: start; }
  .pc-group-right { justify-self: end; }
  /* Boutons "assez gros, friendly" à la Netflix : sans fond visible au
     repos (complètement plats sur la vidéo, pas de pastille grise) — le
     fond n'apparaît qu'au survol/clic. */
  .pc-btn {
    position: relative;
    width: 84px; height: 84px;
    border-radius: 50%;
    border: none;
    background: transparent;
    color: #fff;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    flex: none;
    transition: background 0.18s ease, transform 0.18s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .pc-btn:active { transform: scale(0.9); transition-duration: 0.08s; }
  .pc-btn.active { color: var(--player-accent); }
  .pc-playpause {
    width: 84px; height: 84px;
    background: transparent;
  }
  /* Icônes toutes à la même taille, uniforme sur tous les boutons du
     lecteur (avant : tailles différentes selon le bouton, incohérent). */
  .pc-btn svg { width: 40px; height: 40px; }
  .pc-seek-digit {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -55%);
    font-size: 14px;
    font-weight: 800;
    color: #fff;
    pointer-events: none;
  }
  /* Comme sur Netflix : pas de slider de volume affiché en permanence, juste
     l'icône — le slider se déplie au survol/focus du groupe, ce qui garde la
     barre plus épurée. Pas d'overflow:hidden sur le groupe : ça découpait
     le cercle de survol du bouton son en carré — le slider gère lui-même
     son repli via sa largeur/opacité. */
  .pc-volume-group {
    display: flex;
    align-items: center;
  }
  /* Barre de volume : remplissage violet (comme la barre de progression)
     mis à jour en JS (updateVolumeFill), et plus épaisse pour bien la voir. */
  .pc-volume {
    -webkit-appearance: none;
    appearance: none;
    width: 0;
    height: 6px;
    border-radius: 3px;
    background: linear-gradient(to right, var(--player-accent) 0%, var(--player-accent) 100%, rgba(255,255,255,0.28) 100%, rgba(255,255,255,0.28) 100%);
    outline: none;
    cursor: pointer;
    accent-color: var(--player-accent);
    margin: 0;
    opacity: 0;
    transition: width 0.2s ease, opacity 0.2s ease, margin 0.2s ease, height 0.15s ease;
  }
  .pc-volume-group:hover .pc-volume,
  .pc-volume-group:focus-within .pc-volume {
    width: 96px;
    opacity: 1;
    margin: 0 4px 0 2px;
  }
  .pc-volume:hover { height: 8px; }
  .pc-volume::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 16px; height: 16px;
    border-radius: 50%;
    background: var(--player-accent);
    cursor: pointer;
    transition: transform 0.15s ease;
  }
  .pc-volume:hover::-webkit-slider-thumb { transform: scale(1.2); }
  .pc-volume::-moz-range-thumb {
    width: 16px; height: 16px;
    border: none;
    border-radius: 50%;
    background: var(--player-accent);
    cursor: pointer;
  }
  /* Compteur de temps : maintenant sur la ligne de la barre de progression
     (comme le "32:12" en haut à droite de la barre rouge chez Netflix), plus
     dans la rangée de boutons. */
  .pc-time { font-size: 19px; font-weight: 600; color: #fff; white-space: nowrap; font-variant-numeric: tabular-nums; flex: none; }
  .pc-spacer { flex: 1; }

  /* Écran "en pause depuis 10s" façon Netflix : assombrit la vidéo et
     affiche titre + synopsis en fondu, avec "En pause" en bas à droite.
     Caché par défaut, activé via la classe idle-paused sur .player-view
     (voir scheduleIdlePause/showIdlePauseOverlay en JS). */
  .player-idle-overlay {
    position: absolute;
    inset: 0;
    z-index: 3;
    display: flex;
    align-items: center;
    background: linear-gradient(to right, rgba(0,0,0,0.78) 0%, rgba(0,0,0,0.5) 45%, rgba(0,0,0,0.15) 100%);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.5s ease;
  }
  .player-view.idle-paused .player-idle-overlay { opacity: 1; }
  /* Comme sur Netflix, les contrôles normaux (barres du haut/bas, flèches
     latérales) s'effacent aussi pendant l'écran "en pause" — il ne reste
     que le bloc titre/synopsis et "En pause". */
  .player-view.idle-paused .player-controls,
  .player-view.idle-paused .player-top-gradient {
    opacity: 0;
    pointer-events: none;
  }
  /* Position calée sur la capture Netflix de référence : marge gauche
     nettement plus généreuse (pas collé au bord comme avant). */
  .idle-info {
    max-width: 620px;
    padding: 0 0 0 min(12vw, 130px);
  }
  .idle-eyebrow { font-size: 15px; font-weight: 600; color: rgba(255,255,255,0.75); margin-bottom: 6px; }
  .idle-title { font-size: 40px; font-weight: 800; color: #fff; line-height: 1.1; margin-bottom: 8px; }
  .idle-episode { font-size: 18px; font-weight: 600; color: rgba(255,255,255,0.85); margin-bottom: 14px; }
  .idle-synopsis {
    font-size: 15px;
    line-height: 1.5;
    color: rgba(255,255,255,0.8);
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .idle-paused-label {
    position: absolute;
    right: min(12vw, 130px);
    bottom: 44px;
    font-size: 15px;
    font-weight: 600;
    color: rgba(255,255,255,0.75);
  }
  .player-loading {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 40px; height: 40px;
    border-radius: 50%;
    border: 3px solid rgba(255,255,255,0.25);
    border-top-color: var(--player-accent);
    animation: playerSpin 0.8s linear infinite;
    z-index: 5;
    display: none;
  }
  .player-view.buffering .player-loading { display: block; }
  @keyframes playerSpin { to { transform: translate(-50%, -50%) rotate(360deg); } }

  /* Menu "Audio et sous-titres" (_showAudioSubtitlesMenu) : panneau sombre
     ancré en bas à droite, deux colonnes séparées par une ligne. */
  .player-av-menu {
    display: none;
    position: absolute;
    right: 12px;
    bottom: 90px;
    z-index: 6;
    background: #181818;
    border-radius: 12px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.54);
    overflow: hidden;
  }
  .player-av-menu.open { display: flex; align-items: stretch; }
  .pav-col { width: 190px; max-height: 320px; overflow-y: auto; padding: 14px 0; }

    display: flex;
    align-items: center;

  .pav-row.selected { background: rgba(255,255,255,0.14); color: #fff; font-weight: 600; }
  .pav-check {
    width: 20px; height: 20px;
    border-radius: 50%;
    background: #fff;
    display: flex; align-items: center; justify-content: center;
    flex: none;

  }
  /* Menu "Épisodes de la saison" — même look sombre que le menu audio. */

    display: none;

    max-height: 380px;
    background: #181818;

    box-shadow: 0 4px 16px rgba(0,0,0,0.54);
    overflow: hidden;
    padding: 14px 0;
  }
  .player-ep-menu.open { display: block; }
  .player-ep-menu .pav-col-rows { max-height: 320px; overflow-y: auto; }
  .player-ep-menu .pav-row.selected .pav-check { background: var(--player-accent); }
  .pav-ep-row { gap: 10px; }
  .pav-ep-row.no-video { opacity: 0.45; cursor: default; }
  .pav-ep-thumb {
    flex: none;
    width: 64px; height: 36px;
    border-radius: 6px;
    overflow: hidden;
    background: #000;
  }
  .pav-ep-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .pav-ep-label { flex: 1; }

  /* Évite les flashs "mauvaise vue visible une fraction de seconde" quand
     l'URL pointe déjà sur une fiche/un épisode au chargement (F5) : posées
     par le tout petit script juste après <body> (avant même que le reste
     de la page soit parsé), et retirées par restoreFromHash() une fois la
     bonne vue réellement ouverte (ou en repli sur l'accueil si le lien est
     cassé). visibility (pas display) pour ne pas perturber les calculs de
     mise en page que ces écrans font pendant leur propre ouverture. */
  html.preload-hide-home #homeView { visibility: hidden; }
  /* La barre du haut (flèche retour déjà visible via openDetail, icône
     favoris...) ne doit pas non plus apparaître seule sur fond noir pendant
     le chargement — retour utilisateur : on voyait la flèche + la barre de
     recherche sur un écran sinon vide. */
  html.preload-hide-home .topbar { visibility: hidden; }
  html.preload-hide-detail #detailView { visibility: hidden; }
</style>

<body>
<script>
  // Tout premier script exécuté (avant même que le reste du <body> soit
  // parsé) : pose les classes qui masquent l'accueil (et, pour un lien vers
  // un épisode précis, aussi la fiche détail le temps que le lecteur
  // s'ouvre par-dessus) AVANT que ces vues n'aient la moindre chance de
  // s'afficher — sinon il reste un flash d'une fraction de seconde le temps
  // que restoreFromHash() (tout en bas du fichier) ait fini son travail
  // (fetch réseau de l'animé, de la fiche, puis des vidéos de l'épisode).
  (function () {
    var h = location.hash;
    if (/^#\/anime\/\d+\/ep\/\d+/.test(h)) {
      document.documentElement.classList.add('preload-hide-home', 'preload-hide-detail');
    } else if (/^#\/anime\/\d+$/.test(h)) {
      document.documentElement.classList.add('preload-hide-home');
    }
  })();
</script>
